<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>옴의 법칙 실험실 · 제출 결과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --ink:#1B2A24; --ink-soft:#5E6F67;
  --rule:#CBD6CE; --grid:#DEE6E0; --copper:#B0642B; --copper-soft:#EADACB;
  --blue:#2B5A86; --focus:#2B5A86; --on-copper:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141816; --card:#1C2220; --ink:#E6EDE8; --ink-soft:#9AAAA2;
    --rule:#2E3835; --grid:#28322E; --copper:#D98C4A; --copper-soft:#3A2B1E;
    --blue:#7FB0DA; --focus:#7FB0DA; --on-copper:#14100B;
  }
}
:root[data-theme="dark"]{
  --paper:#141816; --card:#1C2220; --ink:#E6EDE8; --ink-soft:#9AAAA2;
  --rule:#2E3835; --grid:#28322E; --copper:#D98C4A; --copper-soft:#3A2B1E;
  --blue:#7FB0DA; --focus:#7FB0DA; --on-copper:#14100B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
h1,h2{margin:0;font-weight:600;line-height:1.3}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:1rem}
p{margin:.4em 0}
.muted{color:var(--ink-soft);font-size:.86rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{
  padding:8px 14px;border:1px solid var(--copper);background:var(--copper);
  color:var(--on-copper);border-radius:6px;font-weight:500;font-size:.88rem;text-decoration:none;display:inline-block
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* 입장 */
#gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.gate-box{width:100%;max-width:380px}
.gate-box h1{margin-bottom:6px}
.gate-box input{
  width:100%;padding:10px 12px;margin:18px 0 12px;background:var(--card);
  border:1px solid var(--rule);border-radius:6px;
}
.gate-box .btn{width:100%;padding:11px}

/* 상단 */
.topbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:20px
}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* 반 고르기 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{
  border:1px solid var(--rule);background:transparent;padding:6px 11px;border-radius:6px;font-size:.86rem
}
.seg button[aria-pressed="true"]{background:var(--copper-soft);border-color:var(--copper)}
.seg .cnt{color:var(--ink-soft);font-size:.78rem;margin-left:4px}
.search{
  margin-left:auto;padding:7px 10px;background:var(--card);border:1px solid var(--rule);
  border-radius:6px;min-width:180px
}
@media (max-width:640px){.search{margin-left:0;width:100%}}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:0}
.tab{
  border:0;background:transparent;color:var(--ink-soft);padding:10px 16px;
  margin-bottom:-1px;border-bottom:2px solid transparent;font-weight:500
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}

/* 표 */
.sheet{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-top:0;border-radius:0 0 8px 8px}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--grid)}
thead th{
  position:sticky;top:0;background:var(--card);font-size:.76rem;font-weight:500;color:var(--ink-soft);
  border-bottom:1px solid var(--rule)
}
th.n,td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:240px;color:var(--ink-soft);font-size:.8rem}
th.grp{border-left:1px solid var(--rule)}
td.grp{border-left:1px solid var(--grid)}
tbody tr.stu{cursor:pointer}
tbody tr.stu:hover td{background:var(--paper)}
tbody tr.stu[aria-expanded="true"] td{background:var(--copper-soft)}
.low{color:var(--copper);font-weight:500}
tr.detail > td{background:var(--paper);padding:18px;white-space:normal}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft)}

/* 학생 상세 */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.dcard{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.dcard h2{margin-bottom:4px}
svg.plot{width:100%;height:auto;display:block;margin-top:8px}
.mini{margin-top:10px;font-size:.82rem}
.mini th,.mini td{padding:4px 8px}

/* 시작 방식, 회로도 */
.startbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-6px 0 18px}
.dcard.wide{grid-column:1/-1}
svg.circ{width:100%;height:auto;display:block;margin-top:8px;background:var(--card);border-radius:6px}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="gate">
  <div class="gate-box">
    <h1>제출 결과 보기</h1>
    <p class="muted">옴의 법칙 실험실에서 학생들이 제출한 결과를 모아 봅니다. 선생님 비밀번호를 넣어 주세요.</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="선생님 비밀번호" placeholder="비밀번호">
    <button class="btn" id="login" type="button">결과 불러오기</button>
    <p class="muted" id="gate-msg" aria-live="polite"></p>
  </div>
</section>

<section id="main" class="wrap" hidden>
  <div class="topbar">
    <div>
      <h1>옴의 법칙 실험실 제출 결과</h1>
      <p class="muted" id="summary"></p>
    </div>
    <div class="tools">
      <button class="btn ghost" id="reload" type="button">새로고침</button>
      <a class="btn" id="open-sheet" href="#" target="_blank" rel="noopener" aria-disabled="true">구글 시트 열기</a>
      <button class="btn ghost" id="logout" type="button">나가기</button>
    </div>
  </div>

  <div class="startbox">
    <span class="muted">학생 시작 화면</span>
    <div class="seg" id="start-seg" aria-label="학생 시작 화면"></div>
  </div>

  <div class="filters">
    <div class="seg" id="cls-seg" aria-label="반 고르기"></div>
    <input class="search" id="q" type="search" placeholder="이름으로 찾기" aria-label="이름으로 찾기">
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-sum" aria-selected="true">학생별 요약</button>
    <button class="tab" role="tab" id="tab-rows" aria-selected="false">측정값 전체</button>
  </div>
  <div class="sheet" id="sheet"></div>
  <p class="muted" style="margin-top:10px" id="foot"></p>
</section>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   설정 — 학생 페이지(ohm-lab.html)와 같은 웹 앱 주소를 넣습니다
   ========================================================= */
var SERVER_URL = "https://script.google.com/macros/s/AKfycbwMqnIRXm69hvR2Q2Q5k3hjYlzvdA7DyTUxOd7bFpZjwyw8M-BvY45K0fJGdIfTTyrL/exec";

/* ---------- 상태 ---------- */
var data = { students:[], measures:[], sheetUrl:"", startMode:"choice" };
var START_NAMES = { empty:"빈 판", basic:"기본 회로", choice:"학생이 고름" };
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
var view = { cls:"all", q:"", tab:"sum", open:null };
var PW_KEY = "ohmlab.teacher";

function $(id){ return document.getElementById(id); }
function esc(x){
  return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function numOrNull(x){ return (x === "" || x == null || !isFinite(Number(x))) ? null : Number(x); }
function fmt(x, d){
  x = numOrNull(x);
  if(x === null) return "—";
  var t = x.toFixed(d === undefined ? 2 : d);
  if(t.indexOf(".") >= 0) t = t.replace(/\.?0+$/, "");
  return t;
}
function when(iso){
  var d = new Date(iso);
  if(isNaN(d)) return "";
  return (d.getMonth()+1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0"+d.getMinutes()).slice(-2);
}
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}
function byClass(a, b){
  return (parseInt(a.cls,10)||0) - (parseInt(b.cls,10)||0)
      || String(a.cls).localeCompare(String(b.cls))
      || (parseInt(a.no,10)||0) - (parseInt(b.no,10)||0);
}

/* ---------- 서버에서 불러오기 ---------- */
function fetchData(pw){
  if(!SERVER_URL) return Promise.reject(new Error("teacher.html 스크립트 맨 위 SERVER_URL에 웹 앱 주소를 넣어 주세요"));
  return fetch(SERVER_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"list", pw:pw })
  }).then(function(r){ return r.json(); }).then(function(out){
    if(!out || !out.ok) throw new Error(out && out.error ? out.error : "불러오지 못했습니다");
    return out;
  });
}
function savedPw(){ try{ return sessionStorage.getItem(PW_KEY) || ""; }catch(e){ return ""; } }
function rememberPw(pw){ try{ if(pw) sessionStorage.setItem(PW_KEY, pw); else sessionStorage.removeItem(PW_KEY); }catch(e){} }

function login(pw, quiet){
  $("gate-msg").textContent = "불러오는 중…";
  $("login").disabled = true;
  return fetchData(pw).then(function(out){
    rememberPw(pw);
    data = out;
    data.students.sort(byClass);
    $("gate").hidden = true; $("main").hidden = false;
    $("gate-msg").textContent = "";
    render();
    if(!quiet) toast("학생 " + data.students.length + "명의 결과를 불러왔습니다");
  }).catch(function(err){
    rememberPw("");
    $("gate").hidden = false; $("main").hidden = true;
    $("gate-msg").textContent = err.message.indexOf("Failed to fetch") >= 0
      ? "서버에 연결하지 못했습니다. 웹 앱 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요."
      : err.message;
  }).then(function(){ $("login").disabled = false; });
}

/* ---------- 화면 그리기 ---------- */
function filtered(){
  var q = view.q.trim();
  return data.students.filter(function(s){
    return (view.cls === "all" || s.cls === view.cls) && (!q || s.name.indexOf(q) >= 0);
  });
}

function render(){
  var st = data.students;
  var last = st.reduce(function(m, s){ return s.at > m ? s.at : m; }, "");
  $("summary").textContent = "제출한 학생 " + st.length + "명" + (last ? ", 마지막 제출 " + when(last) : "");
  var a = $("open-sheet");
  if(data.sheetUrl){ a.href = data.sheetUrl; a.setAttribute("aria-disabled","false"); }
  $("start-seg").innerHTML = ["empty","basic","choice"].map(function(m){
    return '<button type="button" data-m="'+m+'" aria-pressed="'+(data.startMode===m)+'">'+START_NAMES[m]+'</button>';
  }).join("");

  // 반 버튼 (제출 인원 표시)
  var counts = {}, order = [];
  st.forEach(function(s){ if(!counts[s.cls]){ counts[s.cls] = 0; order.push(s.cls); } counts[s.cls]++; });
  var h = '<button type="button" data-c="all" aria-pressed="'+(view.cls==="all")+'">전체<span class="cnt">'+st.length+'</span></button>';
  order.forEach(function(c){
    h += '<button type="button" data-c="'+esc(c)+'" aria-pressed="'+(view.cls===c)+'">'+esc(c)+'반<span class="cnt">'+counts[c]+'명</span></button>';
  });
  $("cls-seg").innerHTML = h;

  $("tab-sum").setAttribute("aria-selected", view.tab === "sum");
  $("tab-rows").setAttribute("aria-selected", view.tab === "rows");
  if(view.tab === "sum") renderSummary(); else renderRows();
}

function r2Cell(x){
  var v = numOrNull(x);
  if(v === null) return '<td class="n">—</td>';
  return '<td class="n'+(v < 0.95 ? ' low' : '')+'">'+fmt(v,4)+'</td>';
}

function renderSummary(){
  var list = filtered();
  if(list.length === 0){ $("sheet").innerHTML = '<p class="empty">'+(data.students.length ? "조건에 맞는 학생이 없습니다." : "아직 제출한 학생이 없습니다. 학생이 실험실에서 '선생님께 제출'을 누르면 여기에 나타납니다.")+'</p>'; $("foot").textContent=""; return; }
  var h = '<table><thead><tr>'
    + '<th>반</th><th>번호</th><th>이름</th><th>제출</th><th class="n">횟수</th>'
    + '<th class="n grp">실측 R (Ω)</th><th class="n">R²</th><th class="n">측정</th>'
    + '<th class="n grp">가상 R (Ω)</th><th class="n">R²</th><th class="n">측정</th>'
    + '<th class="grp">가상 실험 조건</th></tr></thead><tbody>';
  list.forEach(function(s){
    var open = view.open === s.id;
    h += '<tr class="stu" tabindex="0" data-id="'+esc(s.id)+'" aria-expanded="'+open+'">'
      + '<td>'+esc(s.cls)+'</td><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td>'
      + '<td>'+when(s.at)+'</td><td class="n">'+esc(s.count)+'</td>'
      + '<td class="n grp">'+fmt(s.R)+'</td>'+r2Cell(s.r2)+'<td class="n">'+esc(s.n||0)+'</td>'
      + '<td class="n grp">'+fmt(s.vR)+'</td>'+r2Cell(s.vr2)+'<td class="n">'+esc(s.vn||0)+'</td>'
      + '<td class="wrap grp">'+esc(s.setup || "")+'</td></tr>';
    if(open) h += '<tr class="detail"><td colspan="12">'+detail(s)+'</td></tr>';
  });
  h += '</tbody></table>';
  $("sheet").innerHTML = h;
  $("foot").textContent = "줄을 누르면 그 학생의 그래프와 측정값이 펼쳐집니다. R²가 0.95보다 낮으면 색으로 표시됩니다.";
}

function renderRows(){
  var ids = {}, info = {};
  filtered().forEach(function(s){ ids[s.id] = true; info[s.id] = s; });
  var rows = data.measures.filter(function(m){ return ids[m.id]; });
  rows.sort(function(a, b){
    return byClass(info[a.id], info[b.id]) || String(a.kind).localeCompare(String(b.kind)) || a.k - b.k;
  });
  if(rows.length === 0){ $("sheet").innerHTML = '<p class="empty">표시할 측정값이 없습니다.</p>'; $("foot").textContent=""; return; }
  var h = '<table><thead><tr><th>반</th><th>번호</th><th>이름</th><th>구분</th><th class="n">순번</th>'
        + '<th class="n">전압 (V)</th><th class="n">전류 (mA)</th><th class="n">V / I (Ω)</th></tr></thead><tbody>';
  rows.forEach(function(m){
    var s = info[m.id], v = numOrNull(m.v), i = numOrNull(m.i);
    h += '<tr><td>'+esc(s.cls)+'</td><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td><td>'+esc(m.kind)+'</td>'
       + '<td class="n">'+esc(m.k)+'</td><td class="n">'+fmt(v,3)+'</td>'
       + '<td class="n">'+(i === null ? "—" : fmt(i*1000,2))+'</td>'
       + '<td class="n">'+(v !== null && i ? fmt(v/i,2) : "—")+'</td></tr>';
  });
  h += '</tbody></table>';
  $("sheet").innerHTML = h;
  $("foot").textContent = "학생별 가장 최근 제출의 측정값 " + rows.length + "줄입니다. 지난 제출까지 모두 보려면 구글 시트의 '측정값' 탭을 여세요.";
}

/* ---------- 학생 한 명 상세 ---------- */
function detail(s){
  var mine = data.measures.filter(function(m){ return m.id === s.id; });
  var real = mine.filter(function(m){ return m.kind === "실측"; });
  var virt = mine.filter(function(m){ return m.kind === "가상"; });
  var h = '<div class="dgrid">';
  if(s.circuit && s.circuit.parts && s.circuit.parts.length) h += circuitCard(s.circuit);
  if(real.length) h += card("실측값", real, s.R, s.r2, "");
  if(virt.length) h += card("가상 실험", virt, s.vR, s.vr2, s.setup);
  if(!real.length && !virt.length) h += '<p class="muted">측정값이 없습니다.</p>';
  return h + '</div>';
}

// 학생이 만든 회로를, 부품이 있는 부분만 잘라 보여 준다
function circuitCard(c){
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  c.parts.forEach(function(p){
    if(!DEFS[p.type]) return;
    x0 = Math.min(x0, p.x - 80); x1 = Math.max(x1, p.x + 80);
    y0 = Math.min(y0, p.y - 70); y1 = Math.max(y1, p.y + 70);
  });
  var ok = { parts: c.parts.filter(function(p){ return DEFS[p.type]; }), wires: c.wires || [] };
  var defs = '<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>';
  return '<div class="dcard wide"><h2>학생이 만든 회로</h2>'
       + '<svg class="circ" viewBox="'+x0+' '+y0+' '+(x1-x0)+' '+(y1-y0)+'" role="img" aria-label="학생이 만든 회로도">'
       + defs + circuitSVG(ok, null, {}) + '</svg></div>';
}

function card(title, pts, R, r2, note){
  var h = '<div class="dcard"><h2>'+title+'</h2>'
        + '<p class="muted">저항 '+fmt(R)+' Ω, R² '+fmt(r2,4)+'</p>'
        + (note ? '<p class="muted">'+esc(note)+'</p>' : '')
        + plot(pts)
        + '<table class="mini"><thead><tr><th class="n">전압 (V)</th><th class="n">전류 (mA)</th><th class="n">V / I (Ω)</th></tr></thead><tbody>';
  pts.forEach(function(m){
    var v = Number(m.v), i = Number(m.i);
    h += '<tr><td class="n">'+fmt(v,3)+'</td><td class="n">'+fmt(i*1000,2)+'</td><td class="n">'+(i ? fmt(v/i,2) : "—")+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function niceStep(range, n){
  if(range <= 0) return 1;
  var raw = range/n, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), norm = raw/mag;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
}

// 가로축 전압, 세로축 전류(mA). 원점을 지나는 직선을 맞춰 그립니다.
function plot(pts){
  var W = 340, H = 230, L = 48, Rt = 12, T = 12, B = 40;
  var xs = pts.map(function(m){ return Number(m.v); }), ys = pts.map(function(m){ return Number(m.i)*1000; });
  var xMax = Math.max.apply(null, xs.concat([0.1]))*1.12, yMax = Math.max.apply(null, ys.concat([0.1]))*1.12;
  var xs1 = niceStep(xMax, 4), ys1 = niceStep(yMax, 4);
  xMax = Math.ceil(xMax/xs1)*xs1; yMax = Math.ceil(yMax/ys1)*ys1;
  var px = function(x){ return L + x/xMax*(W-L-Rt); }, py = function(y){ return H-B - y/yMax*(H-T-B); };
  var s = '<svg class="plot" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="전압-전류 그래프">', g;
  for(g=0; g<=xMax+1e-9; g+=xs1){
    s += '<line x1="'+px(g)+'" y1="'+T+'" x2="'+px(g)+'" y2="'+(H-B)+'" stroke="var(--grid)"/>';
    s += '<text x="'+px(g)+'" y="'+(H-B+15)+'" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+fmt(g,2)+'</text>';
  }
  for(g=0; g<=yMax+1e-9; g+=ys1){
    s += '<line x1="'+L+'" y1="'+py(g)+'" x2="'+(W-Rt)+'" y2="'+py(g)+'" stroke="var(--grid)"/>';
    s += '<text x="'+(L-6)+'" y="'+(py(g)+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+fmt(g,1)+'</text>';
  }
  s += '<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-Rt)+'" y2="'+(H-B)+'" stroke="var(--rule)" stroke-width="1.5"/>';
  s += '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--rule)" stroke-width="1.5"/>';
  s += '<text x="'+((L+W-Rt)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--ink)">전압 (V)</text>';
  s += '<text transform="translate(12,'+((T+H-B)/2)+') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink)">전류 (mA)</text>';

  var sxy = 0, sxx = 0;
  for(var k=0;k<xs.length;k++){ sxy += xs[k]*ys[k]; sxx += xs[k]*xs[k]; }
  if(xs.length >= 2 && sxx > 0){
    var a = sxy/sxx, x2 = xMax, y2 = a*x2;
    if(y2 > yMax){ x2 = yMax/a; y2 = yMax; }
    s += '<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(x2)+'" y2="'+py(y2)+'" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 4"/>';
  }
  for(k=0;k<xs.length;k++){
    s += '<circle cx="'+px(xs[k])+'" cy="'+py(ys[k])+'" r="4.5" fill="var(--copper)" stroke="var(--card)" stroke-width="1.5"/>';
  }
  return s + '</svg>';
}

/* ==== 부품 그림 시작 ====
   (teacher.html에도 똑같이 들어 있습니다. 부품 모양을 고치면 두 파일 모두 고쳐 주세요.) */
var RED = "#C8452E";
var BAND = ["#1A1A1A","#7A4A1E","#C62828","#E65100","#F9A825","#2E7D32","#1565C0","#6A1B9A","#757575","#F5F5F5"];
var LEDS = {
  red:  { name:"빨강", col:"#E53935", Is:8.4e-18 },
  green:{ name:"초록", col:"#43A047", Is:2.6e-20 },
  blue: { name:"파랑", col:"#1E88E5", Is:4.8e-27 }
};
function mix(a, b, t){
  t = Math.max(0, Math.min(1, t));
  var x = parseInt(a.slice(1),16), y = parseInt(b.slice(1),16);
  var r = Math.round(((x>>16)&255)*(1-t)+((y>>16)&255)*t);
  var g = Math.round(((x>>8)&255)*(1-t)+((y>>8)&255)*t);
  var c = Math.round((x&255)*(1-t)+(y&255)*t);
  return "rgb("+r+","+g+","+c+")";
}
function hot(T){
  if(T < 350) return "#8E9692";
  if(T < 700) return mix("#8E9692","#C62828",(T-350)/350);
  if(T < 1100) return mix("#C62828","#FF8F00",(T-700)/400);
  return mix("#FF8F00","#FFE082",(T-1100)/1200);
}
function bands(R){
  var e = 0;
  while(R >= 100){ R /= 10; e++; }
  return [BAND[Math.floor(R/10)], BAND[Math.round(R%10)], BAND[e], "#C9A227"];
}
function ohm(r){ return r >= 1000 ? (r/1000) + " kΩ" : r + " Ω"; }

var DEFS = {
  battery:  { name:"건전지", terms:[[-60,0,"−"],[60,0,"+"]], def:{cells:2}, box:[128,40],
              label:function(p){ return "건전지 " + p.cells + "개"; } },
  ac:       { name:"교류 전원", terms:[[-60,0,""],[60,0,""]], def:{vp:3, f:1}, box:[128,56],
              label:function(p){ return "교류 " + p.vp + " V, " + p.f + " Hz"; } },
  sw:       { name:"스위치", terms:[[-40,0,""],[40,0,""]], def:{on:false}, box:[92,64],
              label:function(p){ return p.on ? "스위치 켜짐" : "스위치 꺼짐"; } },
  resistor: { name:"저항기", terms:[[-40,0,""],[40,0,""]], def:{r:47}, box:[92,30],
              label:function(p){ return "저항기 " + ohm(p.r); } },
  nichrome: { name:"니크롬선", terms:[[-60,0,""],[60,0,""]], def:{len:50, dia:0.3}, box:[132,30],
              label:function(p){ return "니크롬선 " + p.len + " cm, " + p.dia + " mm"; } },
  lamp:     { name:"꼬마전구", terms:[[-40,0,""],[40,0,""]], def:{}, box:[92,52],
              label:function(){ return "꼬마전구 2.5 V"; } },
  cap:      { name:"축전기", terms:[[-40,0,""],[40,0,""]], def:{c:1000}, box:[92,44],
              label:function(p){ return "축전기 " + p.c + " µF"; } },
  coil:     { name:"코일", terms:[[-60,0,""],[60,0,""]], def:{l:1}, box:[132,34],
              label:function(p){ return "코일 " + p.l + " H"; } },
  diode:    { name:"다이오드", terms:[[-40,0,"+"],[40,0,"−"]], def:{}, box:[92,34],
              label:function(){ return "다이오드"; } },
  led:      { name:"LED", terms:[[-40,0,"+"],[40,0,"−"]], def:{color:"red"}, box:[92,44],
              label:function(p){ return "LED " + LEDS[p.color].name; } },
  npn:      { name:"트랜지스터", terms:[[-40,0,"B"],[20,-40,"C"],[20,40,"E"]], def:{beta:100}, box:[96,92],
              label:function(p){ return "트랜지스터 β " + p.beta; } },
  ammeter:  { name:"전류계", terms:[[-40,0,"+"],[40,0,"−"]], def:{range:0.5}, box:[92,52], label:null },
  voltmeter:{ name:"전압계", terms:[[-40,0,"+"],[40,0,"−"]], def:{range:15}, box:[92,52], label:null },
  scope:    { name:"오실로스코프", terms:[[-40,44,"1"],[0,44,"2"],[40,44,"⏚"]], def:{tdiv:0.2, vdiv:1}, box:[128,104], label:null }
};

function rotPt(x, y, rot){ for(var k=0;k<(rot||0);k++){ var t = x; x = -y; y = t; } return [x, y]; }
function termWorld(p, k){ var t = DEFS[p.type].terms[k], r = rotPt(t[0], t[1], p.rot); return [p.x + r[0], p.y + r[1]]; }
function wirePath(a, b, flip){
  return flip ? "M"+a[0]+" "+a[1]+" L"+a[0]+" "+b[1]+" L"+b[0]+" "+b[1]
              : "M"+a[0]+" "+a[1]+" L"+b[0]+" "+a[1]+" L"+b[0]+" "+b[1];
}
function circuitTags(c){
  var n = { ammeter:0, voltmeter:0, scope:0 }, L = { ammeter:"A", voltmeter:"V", scope:"S" }, out = {};
  c.parts.forEach(function(p){ if(n[p.type] !== undefined){ n[p.type]++; out[p.id] = L[p.type] + n[p.type]; } });
  return out;
}
function partName(p, tags){
  var d = DEFS[p.type];
  return d.label ? d.label(p.p) : d.name + " " + (tags[p.id] || "");
}

// 회전하기 전 모양 (부품 가운데가 원점)
function partBody(p, st){
  var q = p.p, T = st.T || 20, br = !!st.broken, s = '', k;
  function lead(a, b){ return '<line x1="'+a+'" y1="0" x2="'+b+'" y2="0" stroke="#8C8C8C" stroke-width="2"/>'; }
  switch(p.type){
  case "battery":
    s += lead(-60,-50) + lead(50,60) + '<rect x="-50" y="-15" width="100" height="30" rx="5" fill="#3B403D"/>';
    var w = 92/q.cells;
    for(k=0;k<q.cells;k++){
      var x = -46 + k*w;
      s += '<rect x="'+(x+1).toFixed(1)+'" y="-10" width="'+(w-6).toFixed(1)+'" height="20" rx="3" fill="#C9772F"/>'
         + '<rect x="'+(x+w-5).toFixed(1)+'" y="-4" width="3" height="8" rx="1" fill="#BDBDBD"/>';
    }
    break;
  case "ac":
    s += lead(-60,-46) + lead(46,60) + '<rect x="-46" y="-24" width="92" height="48" rx="6" fill="#44515A"/>'
       + '<path d="M-24 0 C-18 -18 -6 -18 0 0 S18 18 24 0" fill="none" stroke="#F2C94C" stroke-width="2.4"/>';
    break;
  case "sw":
    var ang = 25*Math.PI/180, ex = q.on ? 30 : -30 + 60*Math.cos(ang), ey = q.on ? 0 : -60*Math.sin(ang);
    s += lead(-40,-30) + lead(30,40) + '<rect x="-36" y="3" width="72" height="9" rx="3" fill="#8B6A45"/>'
       + '<circle cx="-30" cy="0" r="4" fill="#B8860B"/><circle cx="30" cy="0" r="4" fill="#B8860B"/>'
       + '<line x1="-30" y1="0" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="#9AA3A8" stroke-width="4" stroke-linecap="round"/>'
       + '<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="5" fill="#2B2B2B"/>';
    break;
  case "resistor":
    s += lead(-40,40);
    s += '<rect x="-18" y="-7" width="36" height="14" rx="6" fill="'+(br ? "#2A2420" : mix("#D8C29C","#6B4A2F",(T-120)/200))+'" stroke="#9C8763"/>';
    if(!br){
      var b = bands(q.r), off = [-10,-5,0,9];
      for(k=0;k<4;k++) s += '<rect x="'+(off[k]-1.25)+'" y="-7" width="2.5" height="14" fill="'+b[k]+'"/>';
    }else s += '<path d="M-3 -11 q-6 -7 0 -13 q6 -6 0 -12" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/>';
    break;
  case "nichrome":
    var loops = Math.max(3, Math.round(4 + q.len/8)), N = loops*8, d = "M-60 0 L-52 0", pen = true;
    for(k=0;k<=N;k++){
      var t = k/N;
      if(br && t > 0.46 && t < 0.54){ pen = false; continue; }
      d += (pen ? " L" : " M") + (-52 + 104*t).toFixed(1) + " " + (8*Math.sin(t*loops*2*Math.PI)).toFixed(1);
      pen = true;
    }
    d += " L60 0";
    if(!br && T > 500) s += '<path d="'+d+'" fill="none" stroke="#FF6E40" stroke-width="7" opacity="'+Math.min(0.75,(T-500)/900).toFixed(2)+'" filter="url(#glow)"/>';
    s += '<path d="'+d+'" fill="none" stroke="'+hot(T)+'" stroke-width="'+(0.8+q.dia*4).toFixed(1)+'" stroke-linejoin="round"/>';
    break;
  case "lamp":
    var g = br ? 0 : clamp((T-800)/1600, 0, 1);
    s += lead(-40,-11) + lead(11,40);
    if(g > 0) s += '<circle cx="0" cy="-14" r="'+(18+10*g).toFixed(1)+'" fill="#FFD36B" opacity="'+(0.85*g).toFixed(2)+'" filter="url(#glow)"/>';
    s += '<circle cx="0" cy="-14" r="12" fill="'+(g > 0 ? mix("#FFFFFF","#FFF1B8",g) : "rgba(255,255,255,.35)")+'" stroke="#9AA6A6" stroke-width="1.2"/>';
    s += '<path d="M-5 -5 L-5 -14 M5 -5 L5 -14" stroke="#9E9E9E" stroke-width="1"/>';
    s += '<path d="'+(br ? 'M-5 -14 l2 -3 l1 4 M5 -14 l-2 -3 l-1 5' : 'M-5 -14 l2 -3 l2 3 l2 -3 l2 3 l2 -3')+'" fill="none" stroke="'+hot(T*0.5)+'" stroke-width="1.4"/>';
    s += '<rect x="-11" y="-5" width="22" height="10" rx="2" fill="#A7A7A7"/>';
    break;
  case "cap":
    s += lead(-40,-6) + lead(6,40) + '<rect x="-8" y="-16" width="4" height="32" fill="var(--ink)"/><rect x="4" y="-16" width="4" height="32" fill="var(--ink)"/>';
    break;
  case "coil":
    var dc = "M-42 0"; for(k=0;k<6;k++) dc += " a7 9 0 0 1 14 0";
    s += lead(-60,-42) + lead(42,60) + '<path d="'+dc+'" fill="none" stroke="#B87333" stroke-width="2.6"/>';
    break;
  case "diode":
    s += lead(-40,40) + '<polygon points="-9,-10 -9,10 9,0" fill="var(--ink)"/><line x1="10" y1="-10" x2="10" y2="10" stroke="var(--ink)" stroke-width="2.5"/>';
    break;
  case "led":
    var L = LEDS[q.color] || LEDS.red, gl = br ? 0 : clamp((st.i || 0)/0.015, 0, 1);
    s += lead(-40,-10) + lead(10,40);
    if(gl > 0.02) s += '<circle cx="0" cy="-4" r="'+(14+10*gl).toFixed(1)+'" fill="'+L.col+'" opacity="'+(0.7*gl).toFixed(2)+'" filter="url(#glow)"/>';
    s += '<path d="M-10 6 L-10 -6 A10 10 0 0 1 10 -6 L10 6 Z" fill="'+(br ? "#3A3A3A" : mix("#9E9E9E", L.col, 0.35+0.65*gl))+'" stroke="#8C8C8C"/>';
    s += '<rect x="-12" y="6" width="24" height="4" rx="1" fill="#9E9E9E"/>';
    break;
  case "npn":
    s += '<circle cx="6" cy="0" r="27" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/>'
       + '<line x1="-40" y1="0" x2="-8" y2="0" stroke="var(--ink)" stroke-width="2"/>'
       + '<rect x="-8" y="-15" width="4" height="30" fill="var(--ink)"/>'
       + '<polyline points="-4,-7 20,-22 20,-40" fill="none" stroke="var(--ink)" stroke-width="2"/>'
       + '<polyline points="-4,7 20,22 20,40" fill="none" stroke="var(--ink)" stroke-width="2"/>'
       + '<polygon points="17,20 8.1,19.2 12.3,12.4" fill="var(--ink)"/>';
    break;
  case "ammeter":
  case "voltmeter":
    s += lead(-40,-22) + lead(22,40) + '<circle cx="0" cy="0" r="22" fill="#F6F2E7" stroke="#6B6B6B" stroke-width="2"/>';
    break;
  case "scope":
    s += '<rect x="-60" y="-44" width="120" height="76" rx="6" fill="#2F3A36"/>'
       + '<rect x="-50" y="-36" width="100" height="52" rx="3" fill="#0E1A16"/>'
       + '<path d="M-44 -10 C-34 -30 -24 -30 -14 -10 S6 10 16 -10 S36 -30 44 -10" fill="none" stroke="#7CE0A0" stroke-width="2"/>';
    [-40,0,40].forEach(function(x){ s += '<line x1="'+x+'" y1="32" x2="'+x+'" y2="44" stroke="#8C8C8C" stroke-width="2"/>'; });
    break;
  }
  return s;
}

function partSVG(p, st, o){
  st = st || {}; o = o || {};
  var d = DEFS[p.type], rot = p.rot || 0, s = '';
  s += '<g'+(o.interactive ? ' data-part="'+p.id+'" style="cursor:grab"' : '')+' transform="translate('+p.x+' '+p.y+') rotate('+(rot*90)+')">';
  if(o.interactive) s += '<rect x="'+(-d.box[0]/2)+'" y="'+(-d.box[1]/2)+'" width="'+d.box[0]+'" height="'+d.box[1]+'" rx="8" fill="transparent"/>';
  if(o.sel) s += '<rect x="'+(-d.box[0]/2-4)+'" y="'+(-d.box[1]/2-4)+'" width="'+(d.box[0]+8)+'" height="'+(d.box[1]+8)+'" rx="10" fill="none" stroke="var(--copper)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  s += partBody(p, st) + '</g>';

  if(p.type === "ammeter" || p.type === "voltmeter"){
    s += '<text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" font-size="16" font-weight="600" fill="#222" font-family="IBM Plex Mono, monospace" pointer-events="none">'+(p.type==="ammeter"?"A":"V")+'</text>';
  }
  var tags = o.tags || {}, lab = d.label ? d.label(p.p) : (tags[p.id] || d.name);
  if(p.type === "scope") lab = "오실로스코프 " + (tags[p.id] || "");
  var half = rot % 2 ? d.box[0]/2 : d.box[1]/2;
  if(rot % 2 === 0) s += '<text x="'+p.x+'" y="'+(p.y-half-7)+'" text-anchor="middle" font-size="12" fill="var(--ink)" pointer-events="none">'+esc(lab)+'</text>';
  else s += '<text x="'+(p.x+half+8)+'" y="'+(p.y+4)+'" font-size="12" fill="var(--ink)" pointer-events="none">'+esc(lab)+'</text>';

  d.terms.forEach(function(t, k){
    var w = termWorld(p, k), key = p.id + ":" + k, pend = o.pending === key;
    s += '<g'+(o.interactive ? ' data-term="'+key+'" style="cursor:crosshair"' : '')+'>';
    if(o.interactive) s += '<circle cx="'+w[0]+'" cy="'+w[1]+'" r="13" fill="transparent"/>';
    if(pend) s += '<circle cx="'+w[0]+'" cy="'+w[1]+'" r="10" fill="none" stroke="var(--copper)" stroke-width="2"/>';
    s += '<circle cx="'+w[0]+'" cy="'+w[1]+'" r="5" fill="'+(t[2]==="+" ? RED : "#B8860B")+'" stroke="var(--card)" stroke-width="1.5"/></g>';
    if(t[2]){
      var dx = w[0]-p.x, dy = w[1]-p.y;
      if(Math.abs(dx) >= Math.abs(dy)) s += '<text x="'+w[0]+'" y="'+(w[1]-10)+'" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)" pointer-events="none">'+t[2]+'</text>';
      else s += '<text x="'+(w[0]+10)+'" y="'+(w[1]+(dy>0?-4:12))+'" font-size="10.5" fill="var(--ink-soft)" pointer-events="none">'+t[2]+'</text>';
    }
  });
  return s;
}
function wireSVG(w, a, b, o){
  var d = wirePath(a, b, w.flip);
  return '<g'+(o.interactive ? ' data-wire="'+w.id+'" style="cursor:pointer"' : '')+'>'
       + (o.interactive ? '<path d="'+d+'" fill="none" stroke="transparent" stroke-width="14"/>' : '')
       + '<path d="'+d+'" fill="none" stroke="'+(o.sel ? "var(--copper)" : "var(--ink-soft)")+'" stroke-width="'+(o.sel?3.2:2.2)+'" stroke-linejoin="round" stroke-linecap="round"/></g>';
}
function circuitSVG(c, stOf, o){
  o = o || {};
  var by = {}, tags = circuitTags(c), s = '';
  c.parts.forEach(function(p){ by[p.id] = p; });
  c.wires.forEach(function(w){
    var pa = by[w.a.pid], pb = by[w.b.pid];
    if(pa && pb) s += wireSVG(w, termWorld(pa, w.a.t), termWorld(pb, w.b.t), { interactive:o.interactive, sel:o.selWire === w.id });
  });
  c.parts.forEach(function(p){
    s += partSVG(p, stOf ? stOf(p) : {}, { interactive:o.interactive, sel:o.sel === p.id, pending:o.pending, tags:tags });
  });
  return s;
}
