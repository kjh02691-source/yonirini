<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옴의 법칙 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --ink:#1B2A24; --ink-soft:#5E6F67;
  --rule:#CBD6CE; --grid:#DEE6E0; --copper:#B0642B; --copper-soft:#EADACB;
  --blue:#2B5A86; --focus:#2B5A86; --on-copper:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141816; --card:#1C2220; --ink:#E6EDE8; --ink-soft:#9AAAA2;
    --rule:#2E3835; --grid:#28322E; --copper:#D98C4A; --copper-soft:#3A2B1E;
    --blue:#7FB0DA; --focus:#7FB0DA; --on-copper:#14100B;
  }
}
:root[data-theme="dark"]{
  --paper:#141816; --card:#1C2220; --ink:#E6EDE8; --ink-soft:#9AAAA2;
  --rule:#2E3835; --grid:#28322E; --copper:#D98C4A; --copper-soft:#3A2B1E;
  --blue:#7FB0DA; --focus:#7FB0DA; --on-copper:#14100B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;
}
.num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:1.05rem}
p{margin:.4em 0}
.muted{color:var(--ink-soft);font-size:.86rem}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- 입장 화면 ---------- */
#gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.gate-box{width:100%;max-width:420px}
.circuit{width:100%;height:auto;margin-bottom:26px;display:block}
.gate-box h1{margin-bottom:6px}
.gate-box .lede{color:var(--ink-soft);margin:0 0 26px;font-size:.92rem}
.field{margin-bottom:14px}
.field label{display:block;font-size:.8rem;color:var(--ink-soft);margin-bottom:5px}
.field input{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--rule);border-radius:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{
  width:100%;padding:11px 16px;border:1px solid var(--copper);
  background:var(--copper);color:var(--on-copper);border-radius:6px;font-weight:500;
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.slim{width:auto;padding:7px 13px;font-size:.87rem}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- 실험 화면 ---------- */
.topbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:18px;
}
.who{font-size:.9rem;color:var(--ink-soft)}
.who b{color:var(--ink);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:24px}
.tab{
  border:0;background:transparent;color:var(--ink-soft);padding:10px 16px;margin-bottom:-1px;
  border-bottom:2px solid transparent;font-weight:500;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}

table{border-collapse:collapse;width:100%}
th,td{padding:0;text-align:left}
thead th{font-size:.76rem;font-weight:500;color:var(--ink-soft);padding:0 6px 6px;border-bottom:1px solid var(--rule)}
tbody td{border-bottom:1px solid var(--grid);padding:2px 0}
tbody input{
  width:100%;padding:8px 6px;background:transparent;border:0;border-radius:4px;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
}
tbody input:focus{background:var(--card)}
td.calc{padding-right:6px;text-align:right;color:var(--ink-soft);font-size:.85rem;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.del{width:26px;text-align:center}
.del button{border:0;background:transparent;color:var(--ink-soft);padding:4px 6px;border-radius:4px;line-height:1}
.del button:hover{color:var(--copper)}
.tbl-foot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.opts{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:8px;font-size:.87rem}

.chart-card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
svg.plot{width:100%;height:auto;display:block}
.readout{
  margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;
  border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--rule)
}
.cell{background:var(--card);padding:12px 14px}
.cell .k{font-size:.76rem;color:var(--ink-soft)}
.cell .v{font-size:1.12rem;font-weight:500;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.verdict{margin-top:14px;font-size:.9rem;padding:11px 14px;border-radius:8px;background:var(--copper-soft);color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;align-items:center}
.hint{margin-top:10px}

/* ---------- 회로 꾸미기 ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.builder{display:grid;grid-template-columns:156px minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:1120px){.builder{grid-template-columns:minmax(0,1fr) 270px}.palette{grid-column:1/-1}}
@media (max-width:780px){.builder{grid-template-columns:1fr}}
.palette{padding:10px}
.palette h3{font-size:.74rem;color:var(--ink-soft);font-weight:500;margin:12px 4px 6px}
.palette h3:first-child{margin-top:2px}
.pal-grid{display:grid;grid-template-columns:1fr;gap:4px}
@media (max-width:1120px){.pal-grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}}
.pal{
  display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--rule);background:var(--paper);
  border-radius:6px;padding:4px 8px;font-size:.84rem;text-align:left;color:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab
}
.pal svg{width:38px;height:24px;flex:none}
.board-card{padding:0;overflow:hidden;position:relative}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px;border-bottom:1px solid var(--rule)}
.toolbar .sp{flex:1}
svg.board{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.board-hint{font-size:.8rem;color:var(--ink-soft);padding:8px 12px;border-top:1px solid var(--rule);min-height:2.6em}
.chooser{
  position:absolute;left:0;right:0;top:53px;bottom:0;display:grid;place-items:center;
  background:var(--card);padding:24px;text-align:center
}
.chooser .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.warns{display:grid;gap:6px;margin-top:12px}
.warn{background:var(--copper-soft);border-left:3px solid var(--copper);padding:8px 12px;border-radius:4px;font-size:.86rem}
.props h2{margin-bottom:8px}
.ctl{margin-bottom:14px}
.ctl .lab{display:block;font-size:.78rem;color:var(--ink-soft);margin-bottom:6px}
.ctl .lab b{color:var(--ink);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{
  border:1px solid var(--rule);background:transparent;color:var(--ink);
  padding:5px 9px;border-radius:6px;font-size:.84rem;
}
.seg button[aria-pressed="true"]{background:var(--copper-soft);border-color:var(--copper)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:6px;font-size:1.1rem;line-height:1}
input[type=range]{width:100%;accent-color:var(--copper)}
.prow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.live{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-size:.78rem;color:var(--ink);margin:.3em 0 0}
.reveal{margin-top:14px}
.reveal h2{margin-bottom:4px}
.factor{border-top:1px solid var(--grid);padding:12px 0 6px;margin-top:8px}
.factor .opt b{font-weight:500}
.pin-row{display:flex;gap:8px;margin-top:12px}
.pin-row input{flex:1;min-width:0;padding:8px 10px;background:var(--paper);border:1px solid var(--rule);border-radius:6px}

.inst{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:16px 0 34px}
.inst h3{font-size:.92rem;font-weight:500;margin:0 0 8px}
.inst .seg{justify-content:center;margin-top:8px}
svg.meter{width:100%;height:auto;display:block}
.mstat{font-size:.8rem;color:var(--ink-soft);text-align:center;margin:6px 0 0;min-height:1.3em}
.mstat.bad{color:var(--copper);font-weight:500}
.scope-card{grid-column:span 2}
@media (max-width:620px){.scope-card{grid-column:auto}}
svg.scope{width:100%;height:auto;display:block;border-radius:6px}
.scope-ctl{display:grid;gap:6px;margin-top:10px}
.scope-ctl .seg{justify-content:flex-start;margin-top:0}
.scope-ctl .lab{font-size:.76rem;color:var(--ink-soft)}

.board-list table{margin-top:14px}
.board-list tbody td{padding:9px 6px;font-size:.9rem;border-bottom:1px solid var(--grid)}
.board-list td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tbl-scroll{overflow-x:auto}
textarea{
  width:100%;min-height:160px;margin-top:14px;padding:12px;background:var(--card);color:inherit;
  border:1px solid var(--rule);border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:.82rem;line-height:1.7;
}
.empty{padding:28px 0;color:var(--ink-soft)}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw;text-align:center
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>

<!-- ======== 1. 입장 화면 ======== -->
<section id="gate">
  <div class="gate-box">
    <svg class="circuit" viewBox="0 0 320 96" fill="none" aria-hidden="true">
      <g stroke="var(--copper)" stroke-width="2" stroke-linecap="round">
        <path d="M18 70 L18 34 M18 34 L108 34"/>
        <path d="M148 34 L214 34"/>
        <path d="M254 34 L302 34 L302 70 L18 70"/>
        <path d="M108 20 L108 48 M120 12 L120 56 M132 20 L132 48 M144 12 L144 56"/>
        <rect x="214" y="22" width="40" height="24" rx="2"/>
      </g>
      <circle cx="160" cy="70" r="15" fill="var(--card)" stroke="var(--copper)" stroke-width="2"/>
      <text x="160" y="76" text-anchor="middle" font-size="15" font-family="IBM Plex Mono, monospace" fill="var(--copper)">A</text>
      <text x="234" y="16" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, monospace" fill="var(--ink-soft)">R</text>
    </svg>
    <h1>옴의 법칙 실험실</h1>
    <p class="lede">직접 잰 전압과 전류를 넣거나, 가상 실험에서 회로를 꾸며 측정해 보세요. 그래프의 기울기에서 저항을 구합니다.</p>
    <div class="row2">
      <div class="field"><label for="g-cls">반</label><input id="g-cls" inputmode="numeric" placeholder="3"></div>
      <div class="field"><label for="g-no">번호</label><input id="g-no" inputmode="numeric" placeholder="14"></div>
    </div>
    <div class="field"><label for="g-name">이름</label><input id="g-name" placeholder="홍길동"></div>
    <button class="btn" id="enter">실험 시작하기</button>
    <p class="muted hint">저장한 기록은 이 기기에 남습니다. 같은 반·번호·이름으로 다시 들어오면 이어서 할 수 있어요.</p>
    <p class="muted hint"><button class="btn ghost slim" id="go-board">저장된 기록 모아 보기</button></p>
  </div>
</section>

<!-- ======== 2. 실험 화면 ======== -->
<section id="lab" class="wrap" hidden>
  <div class="topbar">
    <div>
      <h1>옴의 법칙 실험실</h1>
      <div class="who" id="who"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost slim" id="to-board">기록 모아 보기</button>
      <button class="btn ghost slim" id="leave">나가기</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-real">실측값 입력</button>
    <button class="tab" role="tab" id="tab-virtual">가상 실험</button>
  </div>

  <!-- ---- 가상 실험: 회로 꾸미기 ---- -->
  <div id="vpanel" hidden>
    <div class="builder">
      <aside class="card palette" id="palette" aria-label="부품 상자"></aside>

      <div>
        <div class="card board-card">
          <div class="toolbar">
            <button class="btn ghost slim" type="button" id="tb-rot">회전</button>
            <button class="btn ghost slim" type="button" id="tb-del">지우기</button>
            <span class="sp"></span>
            <button class="btn ghost slim" type="button" id="tb-basic">기본 회로 불러오기</button>
            <button class="btn ghost slim" type="button" id="tb-clear">판 비우기</button>
          </div>
          <svg class="board" id="board" viewBox="0 0 960 600" role="img" aria-label="회로 판">
            <defs>
              <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="0" cy="0" r="1.1" fill="var(--grid)"/>
              </pattern>
              <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
            </defs>
            <rect x="0" y="0" width="960" height="600" fill="var(--card)"/>
            <rect x="0" y="0" width="960" height="600" fill="url(#dots)"/>
            <g id="board-g"></g>
          </svg>
          <div class="board-hint" id="hint"></div>
          <div class="chooser" id="chooser" hidden>
            <div>
              <h2>어떻게 시작할까요?</h2>
              <p class="muted">빈 판에서 부품을 하나씩 놓아 회로를 꾸미거나, 기본 회로를 불러와 고쳐 가며 실험할 수 있습니다.</p>
              <div class="row">
                <button class="btn slim" type="button" id="ch-empty">빈 판에서 시작</button>
                <button class="btn ghost slim" type="button" id="ch-basic">기본 회로로 시작</button>
              </div>
            </div>
          </div>
        </div>
        <div class="warns" id="warns" aria-live="polite"></div>
      </div>

      <aside>
        <div class="card props" id="props"></div>
        <div class="card reveal" id="reveal"></div>
      </aside>
    </div>

    <div class="inst" id="inst"></div>
  </div>

  <!-- ---- 표 + 그래프 (두 탭 공통) ---- -->
  <div class="cols">
    <div>
      <h2>측정값</h2>
      <p class="muted" id="tbl-desc">회로에 걸린 전압과 그때 흐른 전류를 한 줄씩 적습니다.</p>
      <table>
        <thead>
          <tr>
            <th style="width:38%">전압 (V)</th>
            <th style="width:38%" id="th-i">전류 (mA)</th>
            <th style="width:24%;text-align:right">V / I</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="tbl-foot">
        <button class="btn ghost slim" id="add-row">줄 추가</button>
        <button class="btn ghost slim" id="clear">모두 지우기</button>
      </div>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="unit-a"> 전류를 A(암페어) 단위로 입력</label>
        <label class="opt"><input type="checkbox" id="swap"> 가로축을 전류로 바꾸기</label>
        <label class="opt"><input type="checkbox" id="origin" checked> 직선이 원점을 지나게 하기</label>
      </div>
      <div class="actions">
        <button class="btn ghost slim" id="save">이 기기에 저장</button>
        <button class="btn slim" id="submit">선생님께 제출</button>
        <span class="muted" id="save-status" aria-live="polite"></span>
      </div>
    </div>
    <div>
      <div class="chart-card">
        <svg class="plot" id="plot" viewBox="0 0 520 380" role="img" aria-label="전압과 전류 그래프"></svg>
      </div>
      <div class="readout" id="readout"></div>
      <div class="verdict" id="verdict" hidden></div>
    </div>
  </div>
</section>

<!-- ======== 3. 기록 모아 보기 ======== -->
<section id="board-list" class="wrap board-list" hidden>
  <div class="topbar">
    <h1>저장된 기록</h1>
    <button class="btn ghost slim" id="board-back">돌아가기</button>
  </div>
  <div id="board-body"></div>
</section>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   0-가. 서버 설정
   SERVER_URL : Apps Script 웹 앱 주소 (비워 두면 이 기기에만 저장)
   CLASS_KEY  : Code.gs의 CLASS_KEY와 똑같이 맞춥니다
   ========================================================= */
var SERVER_URL = "https://script.google.com/macros/s/AKfycbwMqnIRXm69hvR2Q2Q5k3hjYlzvdA7DyTUxOd7bFpZjwyw8M-BvY45K0fJGdIfTTyrL/exec";
var CLASS_KEY  = "";

/* =========================================================
   0-나. 가상 실험 설정 — 선생님이 바꾸는 곳
   TEACHER_PIN    : 숨겨진 요인을 공개할 때 학생에게 알려 줄 암호
   HIDDEN_FACTORS : 처음에 몰래 켜 둘 요인 (true = 켜짐)
   START_MODE     : 서버에 설정이 없을 때 쓰는 시작 방식
                    "empty" 빈 판 / "basic" 기본 회로 / "choice" 학생이 고름
   ========================================================= */
var TEACHER_PIN = "1234";
var HIDDEN_FACTORS = { heat:true, battery:true, meter:true, wire:true };
var START_MODE = "choice";

var PHYS = {
  T0: 20,              // 실온 (°C)
  cellEmf: 1.5,        // 건전지 1개 전압 (V)
  cellR: 0.4,          // 건전지 1개 내부저항 (Ω)
  acR: 0.2,            // 교류 전원 내부저항 (Ω)
  wireR: 0.05,         // 도선 하나의 저항 (Ω)
  voltOhmPerVolt: 1000,// 전압계: 단자 1 V당 1 kΩ
  ammBurden: 0.1,      // 전류계: 끝눈금 전류에서 0.1 V가 걸림
  idealR: 1e-3,        // 이상적인 도선·스위치
  openG: 1e-9          // 끊어진 곳
};

function $(id){ return document.getElementById(id); }
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function esc(x){
  return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function sendToServer(payload){
  if(!SERVER_URL) return Promise.resolve(false);
  return fetch(SERVER_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(function(res){ return res.json(); })
  .then(function(out){
    if(!out || !out.ok) throw new Error(out && out.error ? out.error : "서버가 거절했습니다");
    return true;
  });
}

var KEY = "ohmlab.v1";

var state = {
  student:null, mode:"real", rows:[], vrows:[],
  unitA:false, swap:false, origin:true
};
var vs = {
  factors: copyFactors(HIDDEN_FACTORS), revealed:false, chosen:false
};
function copyFactors(f){ return { heat:!!f.heat, battery:!!f.battery, meter:!!f.meter, wire:!!f.wire }; }
function blankRows(n){ var a=[]; for(var k=0;k<n;k++) a.push({v:"", i:""}); return a; }
function studentKey(s){ return s.cls + "-" + s.no + "-" + s.name; }

/* =========================================================
   2. 계산 — 최소제곱법과 저항
   ========================================================= */
function points(rows){
  var out = [];
  for(var k=0;k<rows.length;k++){
    var v = parseFloat(rows[k].v), i = parseFloat(rows[k].i);
    if(isFinite(v) && isFinite(i)) out.push({ v:v, i: state.unitA ? i : i/1000 });
  }
  return out;
}
function fit(xs, ys, throughOrigin){
  var n = xs.length, k, a, b;
  if(n < 2) return null;
  if(throughOrigin){
    var sxy=0, sxx=0;
    for(k=0;k<n;k++){ sxy += xs[k]*ys[k]; sxx += xs[k]*xs[k]; }
    if(sxx === 0) return null;
    a = sxy/sxx; b = 0;
  }else{
    var sx=0, sy=0, s2=0, q2=0;
    for(k=0;k<n;k++){ sx+=xs[k]; sy+=ys[k]; s2+=xs[k]*ys[k]; q2+=xs[k]*xs[k]; }
    var den = n*q2 - sx*sx;
    if(den === 0) return null;
    a = (n*s2 - sx*sy)/den; b = (sy - a*sx)/n;
  }
  var my=0; for(k=0;k<n;k++) my += ys[k]; my/=n;
  var ssRes=0, ssTot=0;
  for(k=0;k<n;k++){ var d = ys[k]-(a*xs[k]+b); ssRes+=d*d; ssTot+=(ys[k]-my)*(ys[k]-my); }
  return { a:a, b:b, r2: ssTot === 0 ? 1 : 1 - ssRes/ssTot };
}
function analyse(rows){
  var p = points(rows || activeRows());
  var iScale = state.unitA ? 1 : 1000, iUnit = state.unitA ? "A" : "mA";
  var xs = [], ys = [], k;
  for(k=0;k<p.length;k++){
    if(state.swap){ xs.push(p[k].i*iScale); ys.push(p[k].v); }
    else          { xs.push(p[k].v);        ys.push(p[k].i*iScale); }
  }
  var f = fit(xs, ys, state.origin), R = null;
  if(f && f.a !== 0){
    R = state.swap ? f.a*iScale : 1/(f.a/iScale);
    if(!isFinite(R)) R = null;
  }
  return { xs:xs, ys:ys, fit:f, R:R, n:p.length,
           xLabel: state.swap ? "전류 ("+iUnit+")" : "전압 (V)",
           yLabel: state.swap ? "전압 (V)" : "전류 ("+iUnit+")" };
}
function fmt(x, digits){
  if(x === null || x === undefined || !isFinite(x)) return "—";
  var ax = Math.abs(x);
  if(ax !== 0 && (ax >= 100000 || ax < 0.001)) return x.toExponential(2);
  var t = x.toFixed(digits === undefined ? 3 : digits);
  if(t.indexOf(".") >= 0) t = t.replace(/\.?0+$/,"");
  return t === "-0" ? "0" : t;
}

/* =========================================================
   3. 그래프
   ========================================================= */
var PAD = { l:62, r:18, t:18, b:52 }, W = 520, H = 380;
function niceStep(range, n){
  if(range <= 0) return 1;
  var raw = range/n, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), norm = raw/mag;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10)*mag;
}
function drawPlot(){
  var d = analyse(), xMax = 1, yMax = 1, k;
  for(k=0;k<d.xs.length;k++) if(d.xs[k] > xMax) xMax = d.xs[k];
  for(k=0;k<d.ys.length;k++) if(d.ys[k] > yMax) yMax = d.ys[k];
  xMax *= 1.12; yMax *= 1.12;
  var xStep = niceStep(xMax,5), yStep = niceStep(yMax,5);
  xMax = Math.ceil(xMax/xStep)*xStep; yMax = Math.ceil(yMax/yStep)*yStep;
  var px = function(x){ return PAD.l + (x/xMax)*(W-PAD.l-PAD.r); };
  var py = function(y){ return H-PAD.b - (y/yMax)*(H-PAD.t-PAD.b); };
  var s = "";
  for(var gx=0; gx<=xMax+1e-9; gx+=xStep){
    s += '<line x1="'+px(gx)+'" y1="'+PAD.t+'" x2="'+px(gx)+'" y2="'+(H-PAD.b)+'" stroke="var(--grid)"/>';
    s += '<text x="'+px(gx)+'" y="'+(H-PAD.b+20)+'" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+fmt(gx,2)+'</text>';
  }
  for(var gy=0; gy<=yMax+1e-9; gy+=yStep){
    s += '<line x1="'+PAD.l+'" y1="'+py(gy)+'" x2="'+(W-PAD.r)+'" y2="'+py(gy)+'" stroke="var(--grid)"/>';
    s += '<text x="'+(PAD.l-9)+'" y="'+(py(gy)+4)+'" text-anchor="end" font-size="11" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+fmt(gy,2)+'</text>';
  }
  s += '<line x1="'+PAD.l+'" y1="'+PAD.t+'" x2="'+PAD.l+'" y2="'+(H-PAD.b)+'" stroke="var(--rule)" stroke-width="1.5"/>';
  s += '<line x1="'+PAD.l+'" y1="'+(H-PAD.b)+'" x2="'+(W-PAD.r)+'" y2="'+(H-PAD.b)+'" stroke="var(--rule)" stroke-width="1.5"/>';
  s += '<text x="'+((PAD.l+W-PAD.r)/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12.5" fill="var(--ink)">'+d.xLabel+'</text>';
  s += '<text transform="translate(16,'+((PAD.t+H-PAD.b)/2)+') rotate(-90)" text-anchor="middle" font-size="12.5" fill="var(--ink)">'+d.yLabel+'</text>';
  if(d.fit){
    var x1=0, x2=xMax, y1=d.fit.a*x1+d.fit.b, y2=d.fit.a*x2+d.fit.b;
    if(y2 > yMax){ x2 = (yMax-d.fit.b)/d.fit.a; y2 = yMax; }
    if(y1 < 0){ x1 = -d.fit.b/d.fit.a; y1 = 0; }
    if(isFinite(x1)&&isFinite(x2)&&isFinite(y1)&&isFinite(y2))
      s += '<line x1="'+px(x1)+'" y1="'+py(y1)+'" x2="'+px(x2)+'" y2="'+py(y2)+'" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 4"/>';
  }
  for(k=0;k<d.xs.length;k++)
    s += '<circle cx="'+px(d.xs[k])+'" cy="'+py(d.ys[k])+'" r="5" fill="var(--copper)" stroke="var(--card)" stroke-width="2"/>';
  if(d.n === 0) s += '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" font-size="13" fill="var(--ink-soft)">측정값을 넣으면 여기에 점이 찍힙니다</text>';
  $("plot").innerHTML = s;
  drawReadout(d);
}
function drawReadout(d){
  var slopeUnit = d.fit ? (state.swap ? (state.unitA?"V/A":"V/mA") : (state.unitA?"A/V":"mA/V")) : "";
  $("readout").innerHTML =
    cell("측정한 횟수", d.n + "회") +
    cell("직선의 기울기", d.fit ? fmt(d.fit.a,4)+" "+slopeUnit : "—") +
    cell("저항 R", d.R !== null ? fmt(d.R,2)+" Ω" : "—") +
    cell("직선에 맞는 정도 R²", d.fit ? fmt(d.fit.r2,4) : "—");
  var v = $("verdict");
  if(!d.fit){ v.hidden = true; return; }
  v.hidden = false;
  var virt = state.mode === "virtual";
  if(d.fit.r2 >= 0.99) v.textContent = "점들이 거의 한 직선 위에 놓였습니다. 전압과 전류가 비례한다는 옴의 법칙이 잘 확인됩니다.";
  else if(virt && vs.revealed && hasType("lamp")) v.textContent = "꼬마전구는 전압을 높일수록 필라멘트가 뜨거워져 저항이 커집니다. 그래서 그래프가 휘어집니다. 옴의 법칙을 따르지 않는 소자예요.";
  else if(virt && (hasType("diode") || hasType("led"))) v.textContent = "다이오드와 LED는 일정한 전압을 넘어야 전류가 흐르기 시작합니다. 그래프 모양이 저항과 어떻게 다른지 살펴보세요.";
  else if(virt) v.textContent = "직선에서 벗어난 점이 있습니다. 먼저 단자에 맞는 눈금을 읽었는지 확인하고, 그래도 휘어진다면 왜 그런지 예상해 보세요.";
  else if(d.fit.r2 >= 0.95) v.textContent = "대체로 직선을 이루지만 흩어진 점이 있습니다. 눈금을 잘못 읽은 값이 없는지 확인해 보세요.";
  else v.textContent = "점들이 직선에서 많이 벗어났습니다. 단위(mA인지 A인지)와 회로 연결을 다시 확인해 보세요.";
}
function cell(k, v){ return '<div class="cell"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

function drawRows(){
  var tb = $("rows"), rows = activeRows();
  tb.innerHTML = "";
  rows.forEach(function(r, idx){
    var tr = document.createElement("tr");
    function input(key, label){
      var td = document.createElement("td"), inp = document.createElement("input");
      inp.type="number"; inp.step="any"; inp.inputMode="decimal"; inp.value = r[key]; inp.placeholder="0";
      inp.setAttribute("aria-label", (idx+1)+"번째 "+label);
      inp.addEventListener("input", function(){ activeRows()[idx][key] = inp.value; refreshCalc(); });
      td.appendChild(inp); return td;
    }
    tr.appendChild(input("v","전압")); tr.appendChild(input("i","전류"));
    var tdR = document.createElement("td"); tdR.className = "calc"; tr.appendChild(tdR);
    var tdD = document.createElement("td"); tdD.className = "del";
    var bd = document.createElement("button");
    bd.type="button"; bd.textContent="×"; bd.setAttribute("aria-label",(idx+1)+"번째 줄 지우기");
    bd.addEventListener("click", function(){
      var a = activeRows(); a.splice(idx,1);
      if(a.length === 0) setActiveRows(blankRows(1));
      drawRows();
    });
    tdD.appendChild(bd); tr.appendChild(tdD);
    tb.appendChild(tr);
  });
  refreshCalc();
}
function refreshCalc(){
  var tb = $("rows"), rows = activeRows();
  for(var k=0;k<rows.length;k++){
    var v = parseFloat(rows[k].v), i = parseFloat(rows[k].i), amps = state.unitA ? i : i/1000;
    var c = tb.rows[k] && tb.rows[k].cells[2];
    if(c) c.textContent = (isFinite(v)&&isFinite(amps)&&amps!==0) ? fmt(v/amps,1)+" Ω" : "";
  }
  drawPlot();
}

var RED = "#C8452E";
var BAND = ["#1A1A1A","#7A4A1E","#C62828","#E65100","#F9A825","#2E7D32","#1565C0","#6A1B9A","#757575","#F5F5F5"];

function mix(a, b, t){
  t = Math.max(0, Math.min(1, t));
  var x = parseInt(a.slice(1),16), y = parseInt(b.slice(1),16);
  var r = Math.round(((x>>16)&255)*(1-t)+((y>>16)&255)*t);
  var g = Math.round(((x>>8)&255)*(1-t)+((y>>8)&255)*t);
  var c = Math.round((x&255)*(1-t)+(y&255)*t);
  return "rgb("+r+","+g+","+c+")";
}
function hot(T){
  if(T < 350) return "#8E9692";
  if(T < 700) return mix("#8E9692","#C62828",(T-350)/350);
  if(T < 1100) return mix("#C62828","#FF8F00",(T-700)/400);
  return mix("#FF8F00","#FFE082",(T-1100)/1200);
}
function bands(R){

  return [BAND[Math.floor(R/10)], BAND[Math.round(R%10)], BAND[e], "#C9A227"];
}
function ohm(r){ return r >= 1000 ? (r/1000) + " kΩ" : r + " Ω"; }

var circuit = { parts:[], wires:[] };

var PALETTE = [

function ensureRt(p){
  if(!rt[p.id]) rt[p.id] = { T:PHYS.T0, broken:false, v:0, i:0, val:0, disp:0, blocked:false, over:false };

}
function partById(id){ for(var k=0;k<circuit.parts.length;k++) if(circuit.parts[k].id === id) return circuit.parts[k]; return null; }

function snap(v){ return Math.round(v/20)*20; }

function addPart(type, x, y, rot){
  var d = DEFS[type], p = { id:nextId++, type:type, x:snap(clamp(x,60,900)), y:snap(clamp(y,60,540)), rot:rot||0, p:JSON.parse(JSON.stringify(d.def)) };
  circuit.parts.push(p); ensureRt(p);

}
function addWire(pa, ta, pb, tb){
  var a = { pid:pa.id, t:ta }, b = { pid:pb.id, t:tb };
  var dup = circuit.wires.some(function(w){
    return (w.a.pid===a.pid && w.a.t===a.t && w.b.pid===b.pid && w.b.t===b.t) ||
           (w.a.pid===b.pid && w.a.t===b.t && w.b.pid===a.pid && w.b.t===a.t);

function removePart(id){

}
function parseKey(k){ var a = k.split(":"); return { pid:+a[0], t:+a[1] }; }

function loadBasic(){

  var b = addPart("battery",160,420,0), r = addPart("resistor",420,160,0), v = addPart("voltmeter",420,280,0),

/* =========================================================
   6. 회로 해석 — 노드 전압법 + 비선형 소자 반복 계산
   ========================================================= */
var sim = null, simTime = 0, acc = 0;
var VT = 0.02585;

function thermal(p){
  var q = p.p;
  if(p.type === "resistor") return { R0:q.r, alpha:0.0002, k:0.015, C:0.45, Tmax:280, msg:"저항기가 너무 뜨거워져 타 버렸습니다" };
  if(p.type === "nichrome"){
    var d = q.dia/1000, L = q.len/100, A = Math.PI*d*d/4;
    return { R0:1.1e-6*L/A, alpha:0.0004, k:0.022*L*(q.dia/0.3), C:8400*450*A*L, Tmax:1350, msg:"니크롬선이 녹아 끊어졌습니다" };
  }
  return { R0:0.7, alpha:0.0045, k:3e-4, C:4.5e-5, Tmax:2900, msg:"꼬마전구의 필라멘트가 끊어졌습니다" };
}
function resistanceOf(p){
  var r = rt[p.id], th = thermal(p);
  if(r.broken) return 1e9;
  var T = vs.factors.heat ? r.T : PHYS.T0;
  return th.R0*(1 + th.alpha*(T - PHYS.T0));
}
function coilR(p){ return 10 + 10*p.p.l; }
function srcR(p){ return vs.factors.battery ? (p.type === "battery" ? p.p.cells*PHYS.cellR : PHYS.acR) : PHYS.idealR; }
function srcE(p){ return p.type === "battery" ? p.p.cells*PHYS.cellEmf : p.p.vp*Math.sin(2*Math.PI*p.p.f*simTime); }
function ammR(p){ return vs.factors.meter ? PHYS.ammBurden/p.p.range : PHYS.idealR; }
function voltG(p){ return vs.factors.meter ? 1/(p.p.range*PHYS.voltOhmPerVolt) : PHYS.openG; }

// 회로가 바뀔 때마다: 단자를 노드로 묶고, 잘못된 연결을 찾는다
function compile(){
  var parts = circuit.parts, idx = {}, N = 0, by = {};
  parts.forEach(function(p){ by[p.id] = p; ensureRt(p); DEFS[p.type].terms.forEach(function(t,k){ idx[p.id+":"+k] = N++; }); });
  var par = []; for(var i=0;i<N;i++) par[i] = i;
  function find(a){ while(par[a] !== a){ par[a] = par[par[a]]; a = par[a]; } return a; }
  var deg = new Array(N).fill(0), wires = [];
  circuit.wires.forEach(function(w){
    var a = idx[w.a.pid+":"+w.a.t], b = idx[w.b.pid+":"+w.b.t];
    if(a === undefined || b === undefined) return;
    par[find(a)] = find(b); deg[a]++; deg[b]++; wires.push([a,b]);
  });
  function node(p,k){ return find(idx[p.id+":"+k]); }

  // 노드마다 닿아 있는 부품 (전압계·오실로스코프 제외)
  var touch = {};
  parts.forEach(function(p){
    if(p.type === "voltmeter" || p.type === "scope") return;
    DEFS[p.type].terms.forEach(function(t,k){ var r = node(p,k); (touch[r] = touch[r] || {})[p.id] = true; });
  });

  var warns = [], tags = circuitTags(circuit), hasAC = false, react = false, nonlin = false, maxF = 0;
  parts.forEach(function(p){
    var r = rt[p.id], nm = partName(p, tags);
    r.blocked = false; r.over = false; r.trip = 0; r.conn = true;
    var n = DEFS[p.type].terms.map(function(t,k){ return idx[p.id+":"+k]; });
    if(p.type === "ac"){ hasAC = true; maxF = Math.max(maxF, p.p.f); }
    if(p.type === "cap" || p.type === "coil") react = true;
    if(p.type === "diode" || p.type === "led" || p.type === "npn") nonlin = true;

    if(p.type === "battery" || p.type === "ac"){
      if(deg[n[0]] && deg[n[1]] && node(p,0) === node(p,1)){
        r.blocked = true;
        warns.push(nm + "의 양 끝이 도선으로 바로 이어졌습니다(합선). 사이에 소자를 넣으세요.");
      }
    }
    if(p.type === "ammeter" || p.type === "voltmeter"){
      if(!deg[n[0]] || !deg[n[1]]){ r.conn = false; return; }
      var a = node(p,0), b = node(p,1), tag = tags[p.id];
      if(p.type === "ammeter"){
        if(a === b){ r.blocked = true; warns.push("전류계 "+tag+"의 두 단자가 같은 도선에 이어져 있어 전류가 지나가지 않습니다."); return; }
        // 전원보다 소자를 먼저 살펴서, 경고에 소자 이름이 나오게 한다
        parts.slice().sort(function(m, n2){ return (m.type==="battery"||m.type==="ac") - (n2.type==="battery"||n2.type==="ac"); }).some(function(x){
          if(x === p || x.type === "voltmeter" || x.type === "scope" || x.type === "ammeter") return false;
          var ns = DEFS[x.type].terms.map(function(t,k){ return node(x,k); });
          for(var i2=0;i2<ns.length;i2++) for(var j2=i2+1;j2<ns.length;j2++){
            if((ns[i2]===a && ns[j2]===b) || (ns[i2]===b && ns[j2]===a)){
              r.blocked = true;
              warns.push("전류계 "+tag+"이(가) "+partName(x,tags)+"와(과) 나란히(병렬) 연결되어 있습니다. 전류계는 전류가 지나가는 길에 직렬로 끼워 넣어야 합니다.");
              return true;
            }
          }
          return false;
        });
      }else{
        [[a,b],[b,a]].some(function(pair){
          var ids = Object.keys(touch[pair[0]] || {});
          if(ids.length !== 1) return false;
          var x = by[+ids[0]];
          var touchesOther = DEFS[x.type].terms.some(function(t,k){ return node(x,k) === pair[1]; });
          if(!touchesOther){
            r.blocked = true;
            warns.push("전압계 "+tag+"이(가) 회로에 직렬로 끼워져 있습니다. 측정할 부분의 양 끝에 나란히(병렬) 연결하세요.");
            return true;
          }
          return false;
        });

  var h = hasAC ? Math.min(1e-3, 1/(maxF*60)) : react ? 1e-3 : 4e-3;
  var elems = parts.map(function(p){
    return { p:p, r:rt[p.id], n:DEFS[p.type].terms.map(function(t,k){ return idx[p.id+":"+k]; }), vd:0, vbe:0, vbc:0 };
  });
  sim = { N:N, idx:idx, deg:deg, wires:wires, elems:elems, warns:warns, nonlin:nonlin, h:h,
          x:new Float64Array(N), A:new Float64Array(N*N), B:new Float64Array(N) };
}

function pnjlim(vnew, vold, vt, vcrit){
  if(vnew > vcrit && Math.abs(vnew - vold) > 2*vt){
    if(vold > 0){ var arg = 1 + (vnew - vold)/vt; vnew = arg > 0 ? vold + vt*Math.log(arg) : vcrit; }
    else vnew = vt*Math.log(vnew/vt);

function gauss(A, B, N){
  var x = new Float64Array(N), r, c, k;
  for(c=0;c<N;c++){
    var piv = c, best = Math.abs(A[c*N+c]);
    for(r=c+1;r<N;r++){ var v = Math.abs(A[r*N+c]); if(v > best){ best = v; piv = r; } }
    if(best < 1e-30) continue;
    if(piv !== c){
      for(k=c;k<N;k++){ var t = A[c*N+k]; A[c*N+k] = A[piv*N+k]; A[piv*N+k] = t; }
      var tb = B[c]; B[c] = B[piv]; B[piv] = tb;
    }
    var pv = A[c*N+c];
    for(r=c+1;r<N;r++){
      var f = A[r*N+c]/pv;
      if(f === 0) continue;
      for(k=c;k<N;k++) A[r*N+k] -= f*A[c*N+k];
      B[r] -= f*B[c];
    }
  }
  for(r=N-1;r>=0;r--){
    var s = B[r];
    for(k=r+1;k<N;k++) s -= A[r*N+k]*x[k];
    x[r] = Math.abs(A[r*N+r]) < 1e-30 ? 0 : s/A[r*N+r];

}

function stepOnce(h){
  var N = sim.N; if(!N){ simTime += h; return; }
  var A = sim.A, B = sim.B, x = sim.x, f = vs.factors;
  function g2(a,b,g){ A[a*N+a]+=g; A[b*N+b]+=g; A[a*N+b]-=g; A[b*N+a]-=g; }
  function inj(a,b,i){ B[a]-=i; B[b]+=i; }
  function diode(a, c, Is, nvt, e, key){
    var raw = x[a]-x[c], vcrit = nvt*Math.log(nvt/(Math.SQRT2*Is));
    var v = pnjlim(raw, e[key], nvt, vcrit); e[key] = v;
    var ex = Math.exp(Math.min(v/nvt, 80)), id = Is*(ex-1), gd = Is/nvt*ex + 1e-12;

  for(it=0; it<maxIt; it++){
    A.fill(0); B.fill(0);
    for(var i=0;i<N;i++) A[i*N+i] += PHYS.openG;
    sim.wires.forEach(function(w){ g2(w[0], w[1], 1/(f.wire ? PHYS.wireR : PHYS.idealR)); });
    sim.elems.forEach(function(e){
      var p = e.p, r = e.r, n = e.n, q = p.p;
      switch(p.type){
      case "battery": case "ac":
        if(r.blocked) break;
        var rs = srcR(p); g2(n[0], n[1], 1/rs); inj(n[0], n[1], srcE(p)/rs); break;
      case "sw": g2(n[0], n[1], q.on ? 1/PHYS.idealR : PHYS.openG); break;
      case "resistor": case "nichrome": case "lamp": g2(n[0], n[1], 1/resistanceOf(p)); break;
      case "cap": var gc = q.c*1e-6/h; g2(n[0], n[1], gc); inj(n[0], n[1], -gc*r.v); break;
      case "coil":
        var Lh = q.l/h, G = 1/(coilR(p) + Lh); g2(n[0], n[1], G); inj(n[0], n[1], G*Lh*r.i); break;
      case "diode": if(!r.broken) diode(n[0], n[1], 1e-14, VT, e, "vd"); break;
      case "led": if(!r.broken) diode(n[0], n[1], (LEDS[q.color]||LEDS.red).Is, 2*VT, e, "vd"); break;
      case "npn":
        var Bn = n[0], Cn = n[1], En = n[2], Is = 1e-14, bF = q.beta;

        var gF = Is/VT*eBE, gR = Is/VT*eBC, Ict = Is*(eBE - eBC), I0 = Ict - gF*e.vbe + gR*e.vbc;
        A[Cn*N+Bn] += gF - gR; A[Cn*N+En] -= gF; A[Cn*N+Cn] += gR; B[Cn] -= I0;
        A[En*N+Bn] -= gF - gR; A[En*N+En] += gF; A[En*N+Cn] -= gR; B[En] += I0;
        break;
      case "ammeter": g2(n[0], n[1], (r.blocked || r.over) ? PHYS.openG : 1/ammR(p)); break;
      case "voltmeter": if(!r.blocked) g2(n[0], n[1], voltG(p)); break;

    for(var j=0;j<N;j++){ var dd = Math.abs(xn[j]-x[j]); if(dd > dmax) dmax = dd; }

  var damp = 1 - Math.exp(-h/0.18);

    var p = e.p, r = e.r, n = e.n, q = p.p, v = x[n[0]] - x[n[1]];
    switch(p.type){

      var R = resistanceOf(p); r.i = v/R;
      if(f.heat){
        var th = thermal(p), Teq = PHYS.T0 + r.i*r.i*R/th.k;
        r.T = Teq + (r.T - Teq)*Math.exp(-h*th.k/th.C);
        if(r.T > th.Tmax){ r.broken = true; r.T = th.Tmax; toast(th.msg); propsDirty = true; }
      }else r.T = PHYS.T0;

    case "cap": r.i = q.c*1e-6/h*(v - r.v); r.v = v; break;
    case "coil": var Lh = q.l/h, G = 1/(coilR(p)+Lh); r.i = G*v + G*Lh*r.i; break;

      break;

      break;
    case "ammeter":
      r.val = (r.blocked || r.over || !r.conn) ? 0 : v/ammR(p);
      // 켜는 순간 잠깐 크게 흐르는 전류(전구 등)로는 잠기지 않도록 천천히 따라가는 값으로 판단
      r.trip = (r.trip || 0) + (Math.abs(r.val) - (r.trip || 0))*(1 - Math.exp(-h/0.3));
      if(!r.blocked && !r.over && r.trip > 2*q.range){ r.over = true; r.val = 0; r.trip = 0; }
      r.disp += (r.val - r.disp)*damp;
      break;
    case "voltmeter":
      r.val = (r.blocked || !r.conn) ? 0 : v;
      r.disp += (r.val - r.disp)*damp;
      break;
    case "scope":
      if(r.frozen) break;
      var com = sim.deg[n[2]] > 0;
      var c1 = com && sim.deg[n[0]] > 0 ? x[n[0]] - x[n[2]] : NaN;
      var c2 = com && sim.deg[n[1]] > 0 ? x[n[1]] - x[n[2]] : NaN;
      var bf = r.buf || (r.buf = { t:new Float64Array(SCOPE_LEN), a:new Float32Array(SCOPE_LEN), b:new Float32Array(SCOPE_LEN), head:0, n:0, last:0 });

      bf.head = (bf.head + 1) % SCOPE_LEN; bf.n = Math.min(bf.n + 1, SCOPE_LEN); bf.last = simTime + h;
      break;
    }

}

    var r = rt[p.id]; if(!r) return;
    if(p.type === "ammeter" && r.over) list.push("전류계 "+tags[p.id]+"에 흐르는 전류가 눈금보다 훨씬 큽니다. 더 큰 단자로 바꾸거나 연결을 확인하세요.");
    if((p.type === "battery" || p.type === "ac") && r.big && !r.blocked) list.push(partName(p,tags)+"에서 너무 큰 전류가 나오고 있습니다. 합선된 곳이 없는지 확인하세요.");
  });
  var key = list.join("|");
  if(key === lastWarn) return;
  lastWarn = key;
  $("warns").innerHTML = list.map(function(t){ return '<div class="warn">'+esc(t)+'</div>'; }).join("");
}

function toSvg(e){
  var svg = $("board"), pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  var p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { x:p.x, y:p.y };
}
$("board").addEventListener("pointerdown", function(e){
  var pt = toSvg(e), t = e.target;
  var term = t.closest("[data-term]"), part = t.closest("[data-part]"), wire = t.closest("[data-wire]");
  ui.mouse = pt;
  if(term){
    e.preventDefault();
    var key = term.getAttribute("data-term");
    if(!ui.pending) ui.pending = key;
    else if(ui.pending === key) ui.pending = null;
    else{
      var a = parseKey(ui.pending), b = parseKey(key);
      addWire(partById(a.pid), a.t, partById(b.pid), b.t);
      ui.pending = null; edited(); return;
    }
    renderBoard(); return;
  }
  if(part){
    var id = +part.getAttribute("data-part"), p = partById(id);
    ui.sel = id; ui.selWire = null;
    ui.drag = { id:id, dx:pt.x - p.x, dy:pt.y - p.y, sx:pt.x, sy:pt.y, moved:false };
    $("board").setPointerCapture(e.pointerId);
    renderBoard(); renderProps(); return;
  }
  if(wire){
    ui.selWire = +wire.getAttribute("data-wire"); ui.sel = null; ui.pending = null;
    renderBoard(); renderProps(); return;
  }
  ui.sel = null; ui.selWire = null; ui.pending = null;
  renderBoard(); renderProps();
});
$("board").addEventListener("pointermove", function(e){
  var pt = toSvg(e);
  ui.mouse = pt;
  if(ui.drag){
    var p = partById(ui.drag.id); if(!p) return;
    if(Math.abs(pt.x - ui.drag.sx) + Math.abs(pt.y - ui.drag.sy) > 6) ui.drag.moved = true;
    var nx = snap(clamp(pt.x - ui.drag.dx, 40, 920)), ny = snap(clamp(pt.y - ui.drag.dy, 40, 560));
    if(nx !== p.x || ny !== p.y){ p.x = nx; p.y = ny; renderBoard(); }
  }else if(ui.pending) renderBoard();
});
$("board").addEventListener("pointerup", function(){
  if(ui.drag){
    var p = partById(ui.drag.id);
    if(p && !ui.drag.moved && p.type === "sw"){ p.p.on = !p.p.on; edited(); }
    ui.drag = null;
  }
});

/* =========================================================
   10. 시간이 흐르게 하는 반복
   ========================================================= */
var raf = null, lastT = 0, lastSlow = 0;
function loop(ts){
  if(state.mode !== "virtual" || $("lab").hidden){ raf = null; return; }
  var dt = lastT ? Math.min((ts - lastT)/1000, 0.1) : 0.016;
  lastT = ts;
  if(sim){
    acc += dt;
    var count = 0;
    while(acc >= sim.h && count < 600){ stepOnce(sim.h); acc -= sim.h; count++; }
    if(count >= 600) acc = 0;
  }
  updateMeters(false);
  if(ts - lastSlow > 100){
    lastSlow = ts;
    if(!ui.drag) renderBoard();
    drawScopes(); updateMeters(true); renderWarns(); updateLive();
    if(propsDirty) renderProps(); else updatePropsLive();
  }
  raf = requestAnimationFrame(loop);
}
function startLoop(){ if(!raf){ lastT = 0; raf = requestAnimationFrame(loop); } }

function serialCircuit(){
  return { parts: circuit.parts.map(function(p){ return { id:p.id, type:p.type, x:p.x, y:p.y, rot:p.rot||0, p:JSON.parse(JSON.stringify(p.p)) }; }),
           wires: circuit.wires.map(function(w){ return { id:w.id, a:{pid:w.a.pid, t:w.a.t}, b:{pid:w.b.pid, t:w.b.t}, flip:!!w.flip }; }) };
}
function summaryText(){
  if(!circuit.parts.length) return "";
  var tags = circuitTags(circuit), count = {}, order = [];
  circuit.parts.forEach(function(p){
    var n = DEFS[p.type].label ? partName(p,tags) : DEFS[p.type].name;
    if(!count[n]){ count[n] = 0; order.push(n); }
    count[n]++;
  });
  return order.map(function(n){ return count[n] > 1 ? n + " ×" + count[n] : n; }).join(", ") + ", 도선 " + circuit.wires.length + "개";
}
function vSetup(){
  return { circuit:serialCircuit(), summary:summaryText(), revealed:vs.revealed, factors:copyFactors(vs.factors), chosen:vs.chosen };
}
function restoreCircuit(c){
  circuit = { parts:[], wires:[] }; rt = {}; nextId = 1;
  if(!c || !c.parts) return;
  c.parts.forEach(function(p){
    if(!DEFS[p.type]) return;
    var q = JSON.parse(JSON.stringify(DEFS[p.type].def));
    for(var k in p.p) q[k] = p.p[k];
    circuit.parts.push({ id:p.id, type:p.type, x:p.x, y:p.y, rot:p.rot||0, p:q });
    nextId = Math.max(nextId, p.id + 1);
  });
  (c.wires || []).forEach(function(w){
    if(partById(w.a.pid) && partById(w.b.pid)){ circuit.wires.push({ id:w.id, a:w.a, b:w.b, flip:!!w.flip }); nextId = Math.max(nextId, w.id + 1); }
  });
  circuit.parts.forEach(ensureRt);
}

$("enter").addEventListener("click", function(){
  var cls = $("g-cls").value.trim(), no = $("g-no").value.trim(), nm = $("g-name").value.trim();
  if(!nm){ toast("이름을 넣어 주세요"); $("g-name").focus(); return; }
  state.student = { cls:cls||"-", no:no||"-", name:nm };

  ui.sel = null; ui.selWire = null; ui.pending = null;

  restoreCircuit(null);
  if(saved){
    state.rows  = saved.rows && saved.rows.length ? saved.rows : blankRows(5);

    state.unitA = !!saved.unitA; state.swap = !!saved.swap; state.origin = saved.origin !== false;
    state.mode  = saved.mode === "virtual" ? "virtual" : "real";
    if(saved.v){
      vs.revealed = !!saved.v.revealed;
      vs.factors = saved.v.factors ? copyFactors(saved.v.factors) : copyFactors(HIDDEN_FACTORS);
      vs.chosen = !!saved.v.chosen;
      if(saved.v.circuit) restoreCircuit(saved.v.circuit);
    }
    toast("지난 기록을 불러왔습니다");
  }else{ state.rows = blankRows(5); state.vrows = blankRows(5); }

  $("unit-a").checked = state.unitA; $("swap").checked = state.swap; $("origin").checked = state.origin;
  $("th-i").textContent = "전류 (" + (state.unitA?"A":"mA") + ")";
  $("who").innerHTML = esc(state.student.cls) + "반 " + esc(state.student.no) + "번 <b>" + esc(state.student.name) + "</b>";
  show("lab"); renderReveal(); setMode(state.mode);
});

$("add-row").addEventListener("click", function(){ activeRows().push({v:"",i:""}); drawRows(); });
$("clear").addEventListener("click", function(){ setActiveRows(blankRows(5)); drawRows(); });
$("unit-a").addEventListener("change", function(e){
  state.unitA = e.target.checked; $("th-i").textContent = "전류 (" + (state.unitA?"A":"mA") + ")"; refreshCalc();
});
$("swap").addEventListener("change", function(e){ state.swap = e.target.checked; drawPlot(); });
$("origin").addEventListener("change", function(e){ state.origin = e.target.checked; drawPlot(); });

function cleanRows(rows, unitA){
  var out = [];
  (rows||[]).forEach(function(r){
    var v = parseFloat(r.v), i = parseFloat(r.i);
    if(isFinite(v) && isFinite(i)) out.push({ v:v, i: unitA ? i : i/1000 });
  });
  return out;
}
function payloadOf(entry){
  var v = entry.v || {};
  return {
    action:"submit", key:CLASS_KEY, mode:entry.mode, student:entry.student,
    unit: entry.unitA ? "A" : "mA",
    rows: cleanRows(entry.rows, entry.unitA), R:entry.R, r2:entry.r2, n:entry.n,
    virtual: {
      rows: cleanRows(entry.vrows, entry.unitA), R:entry.vR, r2:entry.vr2, n:entry.vn,
      setup: { summary:v.summary || "", revealed:!!v.revealed, factors:v.factors || null },
      circuit: v.circuit || null
    },
    at: entry.at
  };
}
function status(msg){ $("save-status").textContent = msg || ""; }
function makeEntry(){
  var dR = analyse(state.rows), dV = analyse(state.vrows);
  return {
    student:state.student, rows:state.rows, vrows:state.vrows, mode:state.mode,
    unitA:state.unitA, swap:state.swap, origin:state.origin,
    R:dR.R, r2:dR.fit ? dR.fit.r2 : null, n:dR.n,
    vR:dV.R, vr2:dV.fit ? dV.fit.r2 : null, vn:dV.n,
    v:vSetup(), at:new Date().toISOString(), sent:false
  };
}
function storeEntry(entry){ var all = loadAll(); all[studentKey(state.student)] = entry; return saveAll(all); }
function timeText(d){ return d.getHours() + ":" + ("0"+d.getMinutes()).slice(-2); }

$("save").addEventListener("click", function(){
  var ok = storeEntry(makeEntry());
  toast(ok ? "이 기기에 저장했습니다" : "이 브라우저에서는 저장할 수 없습니다");
  status(ok ? "저장됨, 아직 제출 전" : "");
});
$("submit").addEventListener("click", function(){
  if(!SERVER_URL){ toast("제출 주소가 아직 설정되지 않았습니다. 선생님께 알려 주세요"); return; }
  var entry = makeEntry();
  if(entry.n + entry.vn === 0){ toast("제출할 측정값이 없습니다"); return; }
  if(!confirm("지금 기록과 회로를 선생님께 제출할까요?\n다시 제출하면 가장 최근 값으로 바뀝니다.")) return;
  storeEntry(entry);
  var btn = $("submit"); btn.disabled = true; status("제출하는 중…");
  sendToServer(payloadOf(entry)).then(function(){
    var store = loadAll();
    if(store[studentKey(state.student)]) store[studentKey(state.student)].sent = true;
    saveAll(store);
    status("제출 완료 (" + timeText(new Date()) + ")"); toast("제출했습니다");
  }).catch(function(err){
    status("제출 실패, 이 기기에는 저장됨");
    toast(err && err.message && err.message.indexOf("암호") >= 0 ? err.message : "인터넷 연결을 확인하고 다시 눌러 주세요");
  }).then(function(){ btn.disabled = false; });
});

$("leave").addEventListener("click", function(){ show("gate"); });
$("to-board").addEventListener("click", drawBoardList);
$("go-board").addEventListener("click", drawBoardList);
$("board-back").addEventListener("click", function(){
  if(state.student){ show("lab"); setMode(state.mode); } else show("gate");
});

/* =========================================================
   13. 기록 모아 보기
   ========================================================= */
function drawBoardList(){
  var all = loadAll(), keys = Object.keys(all), body = $("board-body");
  if(keys.length === 0){
    body.innerHTML = '<p class="empty">아직 저장된 기록이 없습니다. 실험을 마치고 저장하면 여기에 모입니다.</p>';
    show("board-list"); return;
  }
  keys.sort(function(a,b){
    var A = all[a].student, B = all[b].student;
    return (parseInt(A.cls,10)||0)-(parseInt(B.cls,10)||0) || (parseInt(A.no,10)||0)-(parseInt(B.no,10)||0);
  });
  var h = "";
  if(SERVER_URL){
    var pending = keys.filter(function(k){ return !all[k].sent; }).length;
    h += '<p class="muted">제출되지 않은 기록 '+pending+'건</p><p><button class="btn ghost slim" id="resend">제출 안 된 기록 한꺼번에 제출하기</button></p>';
  }
  h += '<div class="tbl-scroll"><table><thead><tr><th>반</th><th>번호</th><th>이름</th>'
     + '<th style="text-align:right">실측 R (Ω)</th><th style="text-align:right">실측 R²</th>'
     + '<th style="text-align:right">가상 R (Ω)</th><th style="text-align:right">가상 R²</th>'
     + (SERVER_URL ? '<th>제출</th>' : '') + '<th></th></tr></thead><tbody>';
  var csv = "반,번호,이름,구분,전압(V),전류(A)\n";
  keys.forEach(function(key, k){
    var e = all[key], s = e.student;
    h += '<tr><td>'+esc(s.cls)+'</td><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td>'
       + '<td class="n">'+(e.R!=null?fmt(e.R,2):"—")+'</td><td class="n">'+(e.r2!=null?fmt(e.r2,4):"—")+'</td>'
       + '<td class="n">'+(e.vR!=null?fmt(e.vR,2):"—")+'</td><td class="n">'+(e.vr2!=null?fmt(e.vr2,4):"—")+'</td>'
       + (SERVER_URL ? '<td>'+(e.sent ? "완료" : "안 함")+'</td>' : '')
       + '<td class="del"><button type="button" data-k="'+k+'" aria-label="기록 지우기">×</button></td></tr>';
    cleanRows(e.rows, e.unitA).forEach(function(r, j){ csv += s.cls+","+s.no+","+s.name+",실측,"+r.v+","+r.i+"\n"; });
    cleanRows(e.vrows, e.unitA).forEach(function(r){ csv += s.cls+","+s.no+","+s.name+",가상,"+r.v+","+r.i+"\n"; });
  });
  h += '</tbody></table></div><h2 style="margin-top:32px">표로 옮길 때 쓰는 값</h2>'
     + '<p class="muted">아래 내용을 모두 선택해 복사한 뒤, 엑셀이나 한셀에 붙여 넣으면 표가 됩니다.</p><textarea readonly id="csv"></textarea>';
  body.innerHTML = h;
  $("csv").value = csv;
  body.querySelectorAll(".del button").forEach(function(b){
    b.addEventListener("click", function(){
      var store = loadAll(); delete store[keys[+b.getAttribute("data-k")]]; saveAll(store); drawBoardList();
    });
  });
  var rs = $("resend");
  if(rs) rs.addEventListener("click", function(){
    var store = loadAll(), todo = Object.keys(store).filter(function(kk){ return !store[kk].sent; });
    if(!todo.length){ toast("모두 제출되어 있습니다"); return; }
    rs.disabled = true; rs.textContent = "제출하는 중…";
    var done = 0, failed = 0;
    todo.reduce(function(chain, kk){
      return chain.then(function(){
        return sendToServer(payloadOf(store[kk])).then(function(){
          var s2 = loadAll(); if(s2[kk]){ s2[kk].sent = true; saveAll(s2); } done++;
        }).catch(function(){ failed++; });
      });
    }, Promise.resolve()).then(function(){
      toast(done + "건 제출" + (failed ? ", " + failed + "건 실패" : "")); drawBoardList();
    });
  });
  show("board-list");
}

/* 시작 */
buildPalette();
drawPlot();
fetchConfig();
})();
</script>
