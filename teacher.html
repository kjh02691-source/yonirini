<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>옴의 법칙 실험실 · 제출 결과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --ink:#1B2A24; --ink-soft:#5E6F67;
  --rule:#CBD6CE; --grid:#DEE6E0; --copper:#B0642B; --copper-soft:#EADACB;
  --blue:#2B5A86; --focus:#2B5A86; --on-copper:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141816; --card:#1C2220; --ink:#E6EDE8; --ink-soft:#9AAAA2;
    --rule:#2E3835; --grid:#28322E; --copper:#D98C4A; --copper-soft:#3A2B1E;
    --blue:#7FB0DA; --focus:#7FB0DA; --on-copper:#14100B;
  }
}
:root[data-theme="dark"]{
  --paper:#141816; --card:#1C2220; --ink:#E6EDE8; --ink-soft:#9AAAA2;
  --rule:#2E3835; --grid:#28322E; --copper:#D98C4A; --copper-soft:#3A2B1E;
  --blue:#7FB0DA; --focus:#7FB0DA; --on-copper:#14100B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;
}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
h1,h2{margin:0;font-weight:600;line-height:1.3}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:1rem}
p{margin:.4em 0}
.muted{color:var(--ink-soft);font-size:.86rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{
  padding:8px 14px;border:1px solid var(--copper);background:var(--copper);
  color:var(--on-copper);border-radius:6px;font-weight:500;font-size:.88rem;text-decoration:none;display:inline-block
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* 입장 */
#gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.gate-box{width:100%;max-width:380px}
.gate-box h1{margin-bottom:6px}
.gate-box input{
  width:100%;padding:10px 12px;margin:18px 0 12px;background:var(--card);
  border:1px solid var(--rule);border-radius:6px;
}
.gate-box .btn{width:100%;padding:11px}

/* 상단 */
.topbar{
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:20px
}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* 반 고르기 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{
  border:1px solid var(--rule);background:transparent;padding:6px 11px;border-radius:6px;font-size:.86rem
}
.seg button[aria-pressed="true"]{background:var(--copper-soft);border-color:var(--copper)}
.seg .cnt{color:var(--ink-soft);font-size:.78rem;margin-left:4px}
.search{
  margin-left:auto;padding:7px 10px;background:var(--card);border:1px solid var(--rule);
  border-radius:6px;min-width:180px
}
@media (max-width:640px){.search{margin-left:0;width:100%}}

/* 탭 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:0}
.tab{
  border:0;background:transparent;color:var(--ink-soft);padding:10px 16px;
  margin-bottom:-1px;border-bottom:2px solid transparent;font-weight:500
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--copper)}

/* 표 */
.sheet{overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-top:0;border-radius:0 0 8px 8px}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--grid)}
thead th{
  position:sticky;top:0;background:var(--card);font-size:.76rem;font-weight:500;color:var(--ink-soft);
  border-bottom:1px solid var(--rule)
}
th.n,td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:240px;color:var(--ink-soft);font-size:.8rem}
th.grp{border-left:1px solid var(--rule)}
td.grp{border-left:1px solid var(--grid)}
tbody tr.stu{cursor:pointer}
tbody tr.stu:hover td{background:var(--paper)}
tbody tr.stu[aria-expanded="true"] td{background:var(--copper-soft)}
.low{color:var(--copper);font-weight:500}
tr.detail > td{background:var(--paper);padding:18px;white-space:normal}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft)}

/* 학생 상세 */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.dcard{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px}
.dcard h2{margin-bottom:4px}
svg.plot{width:100%;height:auto;display:block;margin-top:8px}
.mini{margin-top:10px;font-size:.82rem}
.mini th,.mini td{padding:4px 8px}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="gate">
  <div class="gate-box">
    <h1>제출 결과 보기</h1>
    <p class="muted">옴의 법칙 실험실에서 학생들이 제출한 결과를 모아 봅니다. 선생님 비밀번호를 넣어 주세요.</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="선생님 비밀번호" placeholder="비밀번호">
    <button class="btn" id="login" type="button">결과 불러오기</button>
    <p class="muted" id="gate-msg" aria-live="polite"></p>
  </div>
</section>

<section id="main" class="wrap" hidden>
  <div class="topbar">
    <div>
      <h1>옴의 법칙 실험실 제출 결과</h1>
      <p class="muted" id="summary"></p>
    </div>
    <div class="tools">
      <button class="btn ghost" id="reload" type="button">새로고침</button>
      <a class="btn" id="open-sheet" href="#" target="_blank" rel="noopener" aria-disabled="true">구글 시트 열기</a>
      <button class="btn ghost" id="logout" type="button">나가기</button>
    </div>
  </div>

  <div class="filters">
    <div class="seg" id="cls-seg" aria-label="반 고르기"></div>
    <input class="search" id="q" type="search" placeholder="이름으로 찾기" aria-label="이름으로 찾기">
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-sum" aria-selected="true">학생별 요약</button>
    <button class="tab" role="tab" id="tab-rows" aria-selected="false">측정값 전체</button>
  </div>
  <div class="sheet" id="sheet"></div>
  <p class="muted" style="margin-top:10px" id="foot"></p>
</section>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   설정 — 학생 페이지(ohm-lab.html)와 같은 웹 앱 주소를 넣습니다
   ========================================================= */
var SERVER_URL = "https://script.google.com/macros/s/AKfycbwMqnIRXm69hvR2Q2Q5k3hjYlzvdA7DyTUxOd7bFpZjwyw8M-BvY45K0fJGdIfTTyrL/exec";

/* ---------- 상태 ---------- */
var data = { students:[], measures:[], sheetUrl:"" };
var view = { cls:"all", q:"", tab:"sum", open:null };
var PW_KEY = "ohmlab.teacher";

function $(id){ return document.getElementById(id); }
function esc(x){
  return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function numOrNull(x){ return (x === "" || x == null || !isFinite(Number(x))) ? null : Number(x); }
function fmt(x, d){
  x = numOrNull(x);
  if(x === null) return "—";
  var t = x.toFixed(d === undefined ? 2 : d);
  if(t.indexOf(".") >= 0) t = t.replace(/\.?0+$/, "");
  return t;
}
function when(iso){
  var d = new Date(iso);
  if(isNaN(d)) return "";
  return (d.getMonth()+1) + "/" + d.getDate() + " " + d.getHours() + ":" + ("0"+d.getMinutes()).slice(-2);
}
function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._h); toast._h = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}
function byClass(a, b){
  return (parseInt(a.cls,10)||0) - (parseInt(b.cls,10)||0)
      || String(a.cls).localeCompare(String(b.cls))
      || (parseInt(a.no,10)||0) - (parseInt(b.no,10)||0);
}

/* ---------- 서버에서 불러오기 ---------- */
function fetchData(pw){
  if(!SERVER_URL) return Promise.reject(new Error("teacher.html 스크립트 맨 위 SERVER_URL에 웹 앱 주소를 넣어 주세요"));
  return fetch(SERVER_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action:"list", pw:pw })
  }).then(function(r){ return r.json(); }).then(function(out){
    if(!out || !out.ok) throw new Error(out && out.error ? out.error : "불러오지 못했습니다");
    return out;
  });
}
function savedPw(){ try{ return sessionStorage.getItem(PW_KEY) || ""; }catch(e){ return ""; } }
function rememberPw(pw){ try{ if(pw) sessionStorage.setItem(PW_KEY, pw); else sessionStorage.removeItem(PW_KEY); }catch(e){} }

function login(pw, quiet){
  $("gate-msg").textContent = "불러오는 중…";
  $("login").disabled = true;
  return fetchData(pw).then(function(out){
    rememberPw(pw);
    data = out;
    data.students.sort(byClass);
    $("gate").hidden = true; $("main").hidden = false;
    $("gate-msg").textContent = "";
    render();
    if(!quiet) toast("학생 " + data.students.length + "명의 결과를 불러왔습니다");
  }).catch(function(err){
    rememberPw("");
    $("gate").hidden = false; $("main").hidden = true;
    $("gate-msg").textContent = err.message.indexOf("Failed to fetch") >= 0
      ? "서버에 연결하지 못했습니다. 웹 앱 주소와 배포 설정(액세스: 모든 사용자)을 확인해 주세요."
      : err.message;
  }).then(function(){ $("login").disabled = false; });
}

/* ---------- 화면 그리기 ---------- */
function filtered(){
  var q = view.q.trim();
  return data.students.filter(function(s){
    return (view.cls === "all" || s.cls === view.cls) && (!q || s.name.indexOf(q) >= 0);
  });
}

function render(){
  var st = data.students;
  var last = st.reduce(function(m, s){ return s.at > m ? s.at : m; }, "");
  $("summary").textContent = "제출한 학생 " + st.length + "명" + (last ? ", 마지막 제출 " + when(last) : "");
  var a = $("open-sheet");
  if(data.sheetUrl){ a.href = data.sheetUrl; a.setAttribute("aria-disabled","false"); }

  // 반 버튼 (제출 인원 표시)
  var counts = {}, order = [];
  st.forEach(function(s){ if(!counts[s.cls]){ counts[s.cls] = 0; order.push(s.cls); } counts[s.cls]++; });
  var h = '<button type="button" data-c="all" aria-pressed="'+(view.cls==="all")+'">전체<span class="cnt">'+st.length+'</span></button>';
  order.forEach(function(c){
    h += '<button type="button" data-c="'+esc(c)+'" aria-pressed="'+(view.cls===c)+'">'+esc(c)+'반<span class="cnt">'+counts[c]+'명</span></button>';
  });
  $("cls-seg").innerHTML = h;

  $("tab-sum").setAttribute("aria-selected", view.tab === "sum");
  $("tab-rows").setAttribute("aria-selected", view.tab === "rows");
  if(view.tab === "sum") renderSummary(); else renderRows();
}

function r2Cell(x){
  var v = numOrNull(x);
  if(v === null) return '<td class="n">—</td>';
  return '<td class="n'+(v < 0.95 ? ' low' : '')+'">'+fmt(v,4)+'</td>';
}

function renderSummary(){
  var list = filtered();
  if(list.length === 0){ $("sheet").innerHTML = '<p class="empty">'+(data.students.length ? "조건에 맞는 학생이 없습니다." : "아직 제출한 학생이 없습니다. 학생이 실험실에서 '선생님께 제출'을 누르면 여기에 나타납니다.")+'</p>'; $("foot").textContent=""; return; }
  var h = '<table><thead><tr>'
    + '<th>반</th><th>번호</th><th>이름</th><th>제출</th><th class="n">횟수</th>'
    + '<th class="n grp">실측 R (Ω)</th><th class="n">R²</th><th class="n">측정</th>'
    + '<th class="n grp">가상 R (Ω)</th><th class="n">R²</th><th class="n">측정</th>'
    + '<th class="grp">가상 실험 조건</th></tr></thead><tbody>';
  list.forEach(function(s){
    var open = view.open === s.id;
    h += '<tr class="stu" tabindex="0" data-id="'+esc(s.id)+'" aria-expanded="'+open+'">'
      + '<td>'+esc(s.cls)+'</td><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td>'
      + '<td>'+when(s.at)+'</td><td class="n">'+esc(s.count)+'</td>'
      + '<td class="n grp">'+fmt(s.R)+'</td>'+r2Cell(s.r2)+'<td class="n">'+esc(s.n||0)+'</td>'
      + '<td class="n grp">'+fmt(s.vR)+'</td>'+r2Cell(s.vr2)+'<td class="n">'+esc(s.vn||0)+'</td>'
      + '<td class="wrap grp">'+esc(s.setup || "")+'</td></tr>';
    if(open) h += '<tr class="detail"><td colspan="12">'+detail(s)+'</td></tr>';
  });
  h += '</tbody></table>';
  $("sheet").innerHTML = h;
  $("foot").textContent = "줄을 누르면 그 학생의 그래프와 측정값이 펼쳐집니다. R²가 0.95보다 낮으면 색으로 표시됩니다.";
}

function renderRows(){
  var ids = {}, info = {};
  filtered().forEach(function(s){ ids[s.id] = true; info[s.id] = s; });
  var rows = data.measures.filter(function(m){ return ids[m.id]; });
  rows.sort(function(a, b){
    return byClass(info[a.id], info[b.id]) || String(a.kind).localeCompare(String(b.kind)) || a.k - b.k;
  });
  if(rows.length === 0){ $("sheet").innerHTML = '<p class="empty">표시할 측정값이 없습니다.</p>'; $("foot").textContent=""; return; }
  var h = '<table><thead><tr><th>반</th><th>번호</th><th>이름</th><th>구분</th><th class="n">순번</th>'
        + '<th class="n">전압 (V)</th><th class="n">전류 (mA)</th><th class="n">V / I (Ω)</th></tr></thead><tbody>';
  rows.forEach(function(m){
    var s = info[m.id], v = numOrNull(m.v), i = numOrNull(m.i);
    h += '<tr><td>'+esc(s.cls)+'</td><td>'+esc(s.no)+'</td><td>'+esc(s.name)+'</td><td>'+esc(m.kind)+'</td>'
       + '<td class="n">'+esc(m.k)+'</td><td class="n">'+fmt(v,3)+'</td>'
       + '<td class="n">'+(i === null ? "—" : fmt(i*1000,2))+'</td>'
       + '<td class="n">'+(v !== null && i ? fmt(v/i,2) : "—")+'</td></tr>';
  });
  h += '</tbody></table>';
  $("sheet").innerHTML = h;
  $("foot").textContent = "학생별 가장 최근 제출의 측정값 " + rows.length + "줄입니다. 지난 제출까지 모두 보려면 구글 시트의 '측정값' 탭을 여세요.";
}

/* ---------- 학생 한 명 상세 ---------- */
function detail(s){
  var mine = data.measures.filter(function(m){ return m.id === s.id; });
  var real = mine.filter(function(m){ return m.kind === "실측"; });
  var virt = mine.filter(function(m){ return m.kind === "가상"; });
  var h = '<div class="dgrid">';
  if(real.length) h += card("실측값", real, s.R, s.r2, "");
  if(virt.length) h += card("가상 실험", virt, s.vR, s.vr2, s.setup);
  if(!real.length && !virt.length) h += '<p class="muted">측정값이 없습니다.</p>';
  return h + '</div>';
}

function card(title, pts, R, r2, note){
  var h = '<div class="dcard"><h2>'+title+'</h2>'
        + '<p class="muted">저항 '+fmt(R)+' Ω, R² '+fmt(r2,4)+'</p>'
        + (note ? '<p class="muted">'+esc(note)+'</p>' : '')
        + plot(pts)
        + '<table class="mini"><thead><tr><th class="n">전압 (V)</th><th class="n">전류 (mA)</th><th class="n">V / I (Ω)</th></tr></thead><tbody>';
  pts.forEach(function(m){
    var v = Number(m.v), i = Number(m.i);
    h += '<tr><td class="n">'+fmt(v,3)+'</td><td class="n">'+fmt(i*1000,2)+'</td><td class="n">'+(i ? fmt(v/i,2) : "—")+'</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function niceStep(range, n){
  if(range <= 0) return 1;
  var raw = range/n, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), norm = raw/mag;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
}

// 가로축 전압, 세로축 전류(mA). 원점을 지나는 직선을 맞춰 그립니다.
function plot(pts){
  var W = 340, H = 230, L = 48, Rt = 12, T = 12, B = 40;
  var xs = pts.map(function(m){ return Number(m.v); }), ys = pts.map(function(m){ return Number(m.i)*1000; });
  var xMax = Math.max.apply(null, xs.concat([0.1]))*1.12, yMax = Math.max.apply(null, ys.concat([0.1]))*1.12;
  var xs1 = niceStep(xMax, 4), ys1 = niceStep(yMax, 4);
  xMax = Math.ceil(xMax/xs1)*xs1; yMax = Math.ceil(yMax/ys1)*ys1;
  var px = function(x){ return L + x/xMax*(W-L-Rt); }, py = function(y){ return H-B - y/yMax*(H-T-B); };
  var s = '<svg class="plot" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="전압-전류 그래프">', g;
  for(g=0; g<=xMax+1e-9; g+=xs1){
    s += '<line x1="'+px(g)+'" y1="'+T+'" x2="'+px(g)+'" y2="'+(H-B)+'" stroke="var(--grid)"/>';
    s += '<text x="'+px(g)+'" y="'+(H-B+15)+'" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+fmt(g,2)+'</text>';
  }
  for(g=0; g<=yMax+1e-9; g+=ys1){
    s += '<line x1="'+L+'" y1="'+py(g)+'" x2="'+(W-Rt)+'" y2="'+py(g)+'" stroke="var(--grid)"/>';
    s += '<text x="'+(L-6)+'" y="'+(py(g)+3.5)+'" text-anchor="end" font-size="10" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+fmt(g,1)+'</text>';
  }
  s += '<line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-Rt)+'" y2="'+(H-B)+'" stroke="var(--rule)" stroke-width="1.5"/>';
  s += '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--rule)" stroke-width="1.5"/>';
  s += '<text x="'+((L+W-Rt)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="var(--ink)">전압 (V)</text>';
  s += '<text transform="translate(12,'+((T+H-B)/2)+') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink)">전류 (mA)</text>';

  var sxy = 0, sxx = 0;
  for(var k=0;k<xs.length;k++){ sxy += xs[k]*ys[k]; sxx += xs[k]*xs[k]; }
  if(xs.length >= 2 && sxx > 0){
    var a = sxy/sxx, x2 = xMax, y2 = a*x2;
    if(y2 > yMax){ x2 = yMax/a; y2 = yMax; }
    s += '<line x1="'+px(0)+'" y1="'+py(0)+'" x2="'+px(x2)+'" y2="'+py(y2)+'" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 4"/>';
  }
  for(k=0;k<xs.length;k++){
    s += '<circle cx="'+px(xs[k])+'" cy="'+py(ys[k])+'" r="4.5" fill="var(--copper)" stroke="var(--card)" stroke-width="1.5"/>';
  }
  return s + '</svg>';
}

function toggleRow(tr){
  var id = tr.getAttribute("data-id");
  view.open = view.open === id ? null : id;
  renderSummary();
  var again = document.querySelector('tr.stu[data-id="'+id+'"]');
  if(again) again.focus();
}
$("sheet").addEventListener("click", function(e){
  var tr = e.target.closest("tr.stu"); if(tr) toggleRow(tr);
});
$("sheet").addEventListener("keydown", function(e){
  var tr = e.target.closest && e.target.closest("tr.stu");
  if(tr && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleRow(tr); }
});
